<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>WARP STRIKER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#03041a;--fg:#e9f7ff;--dim:#8aa6c8;--cyan:#3ff0ff;--pink:#ff2fa0;--amber:#ffb43f;--red:#ff2d55;--panel:rgba(5,8,30,.74)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#03041a;--fg:#e9f7ff}}
:root[data-theme="dark"]{--bg:#03041a;--fg:#e9f7ff}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:'Orbitron',system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}
.hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.corner{position:absolute;line-height:1.1}
.tl{top:calc(env(safe-area-inset-top,0px) + 12px);left:14px}
.tr{top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;text-align:right}
.bl{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:14px}
.lbl{font-size:10px;letter-spacing:.14em;color:var(--dim)}
.val{font-size:20px;font-weight:700;text-shadow:0 0 12px rgba(63,240,255,.6);font-variant-numeric:tabular-nums}
#shield{display:flex;gap:4px;margin:5px 0 8px}
#shield i{width:18px;height:8px;background:var(--cyan);box-shadow:0 0 8px var(--cyan);transform:skewX(-20deg)}
#shield i.off{background:rgba(63,240,255,.12);box-shadow:none}
#pow{color:var(--amber)}
#bossbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);left:50%;transform:translateX(-50%);width:min(70vw,460px);opacity:0;transition:opacity .4s}
#bossbar.on{opacity:1}
#bossbar .lbl{text-align:center;color:var(--pink);margin-bottom:4px}
#bossbar .bar{height:8px;border:1px solid rgba(255,47,160,.6);padding:1px}
#bossfill{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--amber));box-shadow:0 0 12px var(--pink);transform-origin:left;transition:transform .12s}
#msg{position:fixed;left:0;right:0;top:36%;text-align:center;pointer-events:none;z-index:6;opacity:0;transition:opacity .3s}
#msg.show{opacity:1}
#msg b{display:block;font-size:clamp(26px,7vw,56px);font-weight:900;letter-spacing:.12em;text-shadow:0 0 18px var(--cyan),0 0 40px rgba(63,240,255,.5)}
#msg span{display:block;margin-top:8px;font-size:clamp(11px,2.6vw,15px);letter-spacing:.3em;color:var(--dim)}
#warning{position:fixed;left:0;right:0;top:32%;z-index:7;pointer-events:none;opacity:0}
#warning.on{animation:warn .5s steps(2) 5}
@keyframes warn{0%{opacity:1}100%{opacity:.15}}
#warning .stripe{height:14px;background:repeating-linear-gradient(-45deg,var(--red) 0 16px,transparent 16px 32px)}
#warning .wt{font-size:clamp(34px,10vw,78px);font-weight:900;text-align:center;color:var(--red);letter-spacing:.16em;padding:8px 0 0;text-shadow:0 0 24px var(--red)}
#warning .ws{font-size:clamp(10px,2.6vw,14px);text-align:center;letter-spacing:.3em;color:#ffb3c4;padding:0 0 10px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8;mix-blend-mode:screen}
#mute{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:9;pointer-events:auto;background:rgba(5,8,30,.5);border:1px solid rgba(63,240,255,.35);color:var(--cyan);font:700 11px 'Orbitron',sans-serif;padding:6px 9px;letter-spacing:.1em;cursor:pointer}
.overlay{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(3,4,26,.25),rgba(3,4,26,.85));padding:24px}
.overlay.show{display:flex}
.panel{text-align:center;max-width:520px;width:100%}
.kicker{font-size:11px;letter-spacing:.34em;color:var(--dim)}
.logo{margin:14px 0 18px;font-size:clamp(46px,14vw,96px);line-height:.92;font-weight:900;letter-spacing:.04em;font-style:italic;color:#fff;
  text-shadow:-3px 0 0 rgba(255,47,160,.85),3px 0 0 rgba(63,240,255,.85),0 0 40px rgba(63,240,255,.45)}
.how{font-family:system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;font-size:14px;line-height:1.8;color:#cfe3f5;margin:0 0 24px}
.btn{pointer-events:auto;font:900 18px 'Orbitron',sans-serif;letter-spacing:.24em;color:#03041a;background:var(--cyan);border:0;padding:16px 44px;cursor:pointer;
  clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);box-shadow:0 0 30px rgba(63,240,255,.6)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:4px}
.best{margin-top:16px;font-size:12px;color:var(--dim);letter-spacing:.14em}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:0 auto 24px;max-width:360px;text-align:left}
.res div:nth-child(odd){color:var(--dim);font-size:12px;letter-spacing:.14em;align-self:center}
.res div:nth-child(even){text-align:right;font-size:20px;font-weight:700}
.rank{font-size:clamp(70px,20vw,120px);font-weight:900;font-style:italic;line-height:1;color:var(--amber);text-shadow:0 0 30px var(--amber);margin:4px 0 14px}
@media (prefers-reduced-motion: reduce){#warning.on{animation:none;opacity:1}}
</style>
</head>
<body>
<div id="game"></div>
<div class="hud">
  <div class="corner tl"><div class="lbl">SCORE</div><div class="val" id="score">00000000</div></div>
  <div class="corner tr"><div class="lbl">TIME</div><div class="val" id="time">0.00</div></div>
  <div id="bossbar"><div class="lbl" id="bossname">GUARDIAN</div><div class="bar"><i id="bossfill"></i></div></div>
  <div class="corner bl"><div class="lbl">SHIELD</div><div id="shield"></div><div class="lbl">POWER <span id="pow">1</span></div></div>
</div>
<button id="mute" aria-label="サウンド切替">SOUND ON</button>
<div id="msg"></div>
<div id="warning"><div class="stripe"></div><div class="wt">WARNING</div><div class="ws" id="wsub">HUGE ENERGY APPROACHING</div><div class="stripe"></div></div>
<div id="flash"></div>
<div id="screen" class="overlay show"><div class="panel" id="panel"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
'use strict';
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const $=id=>document.getElementById(id);

/* =================== AUDIO =================== */
const SND=(()=>{
  let ctx=null,master,bgm,se,delay,noiseBuf,muted=false,timer=null,step=0,next=0,mode='off',pending=null;
  const BPM=150,ST=60/BPM/4;
  const last={};
  function init(){
    if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ctx=new AC();
    const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-12; comp.ratio.value=5; comp.connect(ctx.destination);
    master=ctx.createGain(); master.gain.value=muted?0:0.85; master.connect(comp);
    bgm=ctx.createGain(); bgm.gain.value=0.42; bgm.connect(master);
    se=ctx.createGain(); se.gain.value=0.7; se.connect(master);
    delay=ctx.createDelay(1); delay.delayTime.value=ST*3;
    const fb=ctx.createGain(); fb.gain.value=0.32; delay.connect(fb); fb.connect(delay);
    const dOut=ctx.createGain(); dOut.gain.value=0.3; delay.connect(dOut); dOut.connect(bgm);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  const mtof=n=>440*Math.pow(2,(n-69)/12);
  function env(g,t,a,p,dec){ g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(p,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec); }
  function osc(type,f,t,dur,vol,dest,f2,det){
    const o=ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    if(det) o.detune.value=det;
    const g=ctx.createGain(); env(g,t,0.004,vol,dur); o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+0.05);
  }
  function noise(t,dur,vol,dest,type,f0,f1,q){
    const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    const f=ctx.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.setValueAtTime(f0,t);
    if(f1) f.frequency.exponentialRampToValueAtTime(f1,t+dur); f.Q.value=q||1;
    const g=ctx.createGain(); env(g,t,0.003,vol,dur); s.connect(f); f.connect(g); g.connect(dest);
    s.start(t); s.stop(t+dur+0.05);
  }
  // ---- instruments
  function kick(t){ osc('sine',170,t,0.3,1.0,bgm,38); noise(t,0.02,0.3,bgm,'highpass',3000); }
  function snare(t){ noise(t,0.18,0.5,bgm,'bandpass',1900,900,0.7); osc('triangle',230,t,0.08,0.3,bgm,130); }
  function hat(t,open){ noise(t,open?0.12:0.035,0.13,bgm,'highpass',8000); }
  function bass(t,n,len){
    const o1=ctx.createOscillator(),o2=ctx.createOscillator(); o1.type=o2.type='sawtooth';
    o1.frequency.value=mtof(n); o2.frequency.value=mtof(n); o2.detune.value=9;
    const f=ctx.createBiquadFilter(); f.type='lowpass'; f.Q.value=7;
    f.frequency.setValueAtTime(1500,t); f.frequency.exponentialRampToValueAtTime(160,t+len);
    const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.26,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+len);
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(bgm);
    o1.start(t); o2.start(t); o1.stop(t+len+0.05); o2.stop(t+len+0.05);
  }
  function lead(t,n,len,vol,type,wet){
    const o1=ctx.createOscillator(),o2=ctx.createOscillator(); o1.type=o2.type=type||'square';
    o1.frequency.value=mtof(n); o2.frequency.value=mtof(n); o2.detune.value=-11;
    const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=3600;
    const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.006);
    g.gain.setValueAtTime(vol,t+len*0.7); g.gain.exponentialRampToValueAtTime(0.0001,t+len+0.06);
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(bgm); if(wet) g.connect(delay);
    o1.start(t); o2.start(t); o1.stop(t+len+0.1); o2.stop(t+len+0.1);
  }
  // ---- patterns
  const CH={m:[0,3,7,12],M:[0,4,7,12],d:[0,3,6,9]};
  const ARP=[0,1,2,3,2,1,2,3,0,1,2,3,3,2,1,2];
  const PAT={
    normal:{roots:[45,41,43,40],q:['m','M','M','m'],kick:[0,4,8,12]},
    boss:{roots:[45,46,43,44],q:['m','M','M','d'],kick:[0,3,4,8,11,12]},
  };
  const MEL=[[0,76,4],[4,74,2],[6,72,2],[8,76,4],[12,79,4],[16,77,6],[22,76,2],[24,72,4],[28,74,4],
             [32,74,4],[36,76,2],[38,79,2],[40,81,6],[46,79,2],[48,76,8],[56,74,4],[60,71,4]];
  const MELMAP={}; MEL.forEach(m=>MELMAP[m[0]]=m);
  function playStep(s,t){
    const st=s%16;
    if(st===0&&pending){ mode=pending; pending=null; }
    if(mode==='off') return;
    const bar=Math.floor(s/16)%4;
    if(mode==='warn'){
      if(st%4===0) kick(t);
      if(st===0) bass(t,33,ST*15);
      if(st%8===4) osc('sawtooth',mtof(81),t,ST*3,0.04,bgm,mtof(80));
      return;
    }
    const P=PAT[mode], root=P.roots[bar], ch=CH[P.q[bar]], boss=mode==='boss';
    if(P.kick.includes(st)) kick(t);
    if(st===4||st===12) snare(t);
    if(boss||st%2===0) hat(t,st%4===2);
    if(boss) bass(t,root-12+(st%2?12:0),ST*0.9);
    else if(st%2===0) bass(t,root-12+(st%4===2?12:0),ST*1.7);
    lead(t,root+24+ch[ARP[st]]+(boss?12:0),ST*0.85,boss?0.03:0.026,boss?'sawtooth':'square',false);
    if(!boss){ const m=MELMAP[s%64]; if(m&&s>=64) lead(t,m[1],ST*m[2]*0.95,0.055,'sawtooth',true); }
    if(boss&&(st===0||st===6||st===12)){ for(let i=0;i<3;i++) lead(t,root+24+ch[i],ST*1.2,0.03,'sawtooth',true); }
  }
  function sched(){
    if(!ctx) return;
    if(next<ctx.currentTime-0.2) next=ctx.currentTime+0.05;
    while(next<ctx.currentTime+0.15){ playStep(step,next); next+=ST; step++; }
  }
  function music(m,immediate){
    if(!ctx) return;
    if(!timer){ step=0; next=ctx.currentTime+0.06; timer=setInterval(sched,25); mode=m; return; }
    if(immediate){ mode=m; step=Math.ceil(step/16)*16; } else pending=m;
  }
  function throttle(k,ms){ const n=performance.now(); if(last[k]&&n-last[k]<ms) return false; last[k]=n; return true; }
  const now=()=>ctx.currentTime;
  return {
    init, music,
    toggle(){ muted=!muted; if(master) master.gain.value=muted?0:0.85; return muted; },
    suspend(){ if(ctx&&ctx.state==='running') ctx.suspend(); }, resume(){ if(ctx&&ctx.state==='suspended') ctx.resume(); },
    shot(){ if(!ctx||!throttle('shot',80)) return; osc('square',1500,now(),0.05,0.028,se,520); },
    hit(){ if(!ctx||!throttle('hit',45)) return; osc('triangle',1100,now(),0.04,0.05,se,1800); },
    eshot(){ if(!ctx||!throttle('es',90)) return; osc('triangle',640,now(),0.09,0.05,se,260); },
    boom(sz){ if(!ctx||!throttle('boom',40)) return; const t=now(); sz=sz||1;
      noise(t,0.3+sz*0.2,Math.min(0.75,0.35+sz*0.15),se,'lowpass',3200,110); osc('sine',130,t,0.3+sz*0.1,0.55,se,38); },
    bigBoom(){ if(!ctx) return; const t=now();
      noise(t,1.5,0.9,se,'lowpass',5000,60); noise(t+0.12,1.1,0.6,se,'lowpass',2500,80); osc('sine',95,t,1.3,0.9,se,24); },
    megaBoom(){ if(!ctx) return; const t=now();
      noise(t,2.8,1.0,se,'lowpass',7000,40); noise(t+0.2,2.2,0.7,se,'bandpass',900,120,0.6); osc('sine',80,t,2.4,1.0,se,20); osc('sawtooth',60,t,1.5,0.25,se,25); },
    warp(){ if(!ctx) return; const t=now();
      noise(t,2.5,0.5,se,'bandpass',260,7000,2.5); osc('sawtooth',70,t,2.5,0.12,se,1400); osc('sawtooth',73,t,2.5,0.1,se,1480); },
    warpExit(){ if(!ctx) return; const t=now();
      noise(t,1.3,0.9,se,'lowpass',9000,90); osc('sine',240,t,1.0,0.9,se,30); osc('square',1760,t,0.4,0.08,se,220); },
    warning(){ if(!ctx) return; const t=now();
      for(let i=0;i<5;i++){ osc('square',880,t+i*0.5,0.22,0.1,se); osc('square',622,t+i*0.5+0.25,0.22,0.1,se); } },
    damage(){ if(!ctx) return; const t=now(); osc('sawtooth',340,t,0.35,0.35,se,55); noise(t,0.25,0.5,se,'lowpass',2500,300); },
    power(){ if(!ctx) return; const t=now(); [72,76,79,84,88].forEach((n,i)=>osc('square',mtof(n),t+i*0.05,0.09,0.07,se)); },
    charge(){ if(!ctx) return; const t=now(); osc('sawtooth',180,t,0.72,0.08,se,1900); osc('sine',360,t,0.72,0.08,se,3800); },
    laser(){ if(!ctx) return; const t=now(); noise(t,0.95,0.55,se,'bandpass',1300,500,0.8); osc('sawtooth',980,t,0.9,0.16,se,180); osc('square',490,t,0.9,0.08,se,95); },
    roar(){ if(!ctx) return; const t=now(); osc('sawtooth',55,t,2.4,0.3,se,40); osc('sawtooth',58,t,2.4,0.25,se,41); noise(t,2.4,0.3,se,'lowpass',400,120); },
    fanfare(){ if(!ctx) return; const t=now()+0.05;
      [[69,0,0.14],[73,0.14,0.14],[76,0.28,0.14],[81,0.42,0.6],[80,1.02,0.14],[81,1.16,1.1]].forEach(n=>{ lead(t+n[1],n[0],n[2],0.08,'sawtooth',true); lead(t+n[1],n[0]-12,n[2],0.05,'square',false); });
      [45,57,64,69].forEach(n=>lead(t+1.16,n,1.3,0.04,'sawtooth',true)); }
  };
})();

/* =================== RENDERER =================== */
const DPR=Math.min(window.devicePixelRatio||1,2);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x03041a,1);
$('game').appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x070a26,70,460);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,2200);
camera.position.set(0,3,14);
let baseFov=70;

let composer=null,bloom=null;
try{
  if(THREE.EffectComposer&&THREE.RenderPass&&THREE.UnrealBloomPass){
    composer=new THREE.EffectComposer(renderer);
    composer.setPixelRatio(Math.min(DPR,1.5));
    composer.addPass(new THREE.RenderPass(scene,camera));
    bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.85,0.45,0.34);
    composer.addPass(bloom);
  }
}catch(err){ composer=null; }

let BX=8,BY=5;
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h);
  if(composer) composer.setSize(w,h);
  camera.aspect=w/h;
  baseFov=camera.aspect<1?70+(1-camera.aspect)*34:70;
  const halfH=Math.tan(baseFov*Math.PI/360)*14;
  BX=Math.min(halfH*camera.aspect*0.8,12.5);
  BY=halfH*0.56;
}
addEventListener('resize',resize); resize();

/* =================== TEXTURES =================== */
function canvasTex(size,draw){ const c=document.createElement('canvas'); c.width=c.height=size; draw(c.getContext('2d'),size); const t=new THREE.CanvasTexture(c); return t; }
const TEX={
  glow:canvasTex(128,(g,s)=>{ const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(0.18,'rgba(255,255,255,.85)'); r.addColorStop(0.45,'rgba(255,255,255,.22)'); r.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=r; g.fillRect(0,0,s,s); }),
  bulletPink:canvasTex(64,(g,s)=>{ const r=g.createRadialGradient(32,32,0,32,32,32);
    r.addColorStop(0,'#fff'); r.addColorStop(0.28,'#fff'); r.addColorStop(0.4,'#ff4fb6'); r.addColorStop(0.7,'rgba(255,40,150,.35)'); r.addColorStop(1,'rgba(255,40,150,0)');
    g.fillStyle=r; g.fillRect(0,0,s,s); }),
  bulletAmber:canvasTex(64,(g,s)=>{ const r=g.createRadialGradient(32,32,0,32,32,32);

  n=n||1; spread=spread||0; _v.set(player.x-from.x,player.y-from.y,player.z-from.z).normalize();
  for(let i=0;i<n;i++){ const a=n>1?(i/(n-1)-0.5)*spread*2:0, c=Math.cos(a), s=Math.sin(a);
    eBullet(from.x,from.y,from.z,(_v.x*c+_v.z*s)*speed,_v.y*speed,(-_v.x*s+_v.z*c)*speed,col); }
  SND.eshot();
}
function radial(from,n,sxy,vz,col,rot){ for(let k=0;k<n;k++){ const a=(rot||0)+k/n*TAU; eBullet(from.x,from.y,from.z,Math.cos(a)*sxy,Math.sin(a)*sxy,vz,col); } SND.eshot(); }
function clearEB(){ for(const b of ebs){ if(!b.on) continue; const p=b.s.position; spawnP(p.x,p.y,p.z,0,0,20,0.4,1.4,0.6,0.9,1,1); b.on=false; b.s.visible=false; } }
function updateEBullets(dt){
  for(const b of ebs){ if(!b.on) continue; const p=b.s.position;
    p.x+=b.vx*dt; p.y+=b.vy*dt; p.z+=b.vz*dt;
    if(p.z>20||Math.abs(p.x)>90||Math.abs(p.y)>60){ b.on=false; b.s.visible=false; continue; }
    if(player.alive&&G.invuln<=0&&Math.abs(p.z-player.z)<1.2){ const dx=p.x-player.x,dy=p.y-player.y; if(dx*dx+dy*dy<0.62){ b.on=false; b.s.visible=false; damagePlayer(); } }

function addEnemy(o){

function fireLaser(dir,delay){ later(delay,()=>{ if(!G.boss||G.boss.dying||!player.alive) return;

function updateLasers(dt){
  for(let i=lasers.length-1;i>=0;i--){ const l=lasers[i]; l.t+=dt; const T1=0.78,T2=T1+0.95,T3=T2+0.25;
    let w,cw,op,cop;
    if(l.t<T1){ w=0.1+Math.random()*0.12; cw=0.02; op=0.35+Math.random()*0.35; cop=0; }
    else if(l.t<T2){ if(!l.fired){ l.fired=true; SND.laser(); G.shake=Math.max(G.shake,0.7); G.fovKick+=3; }
      w=2.5*(1+Math.sin(l.t*70)*0.1); cw=0.75; op=0.85; cop=1;
      if(player.alive&&G.invuln<=0){ const d=l.dir==='v'?Math.abs(player.x-l.pos):Math.abs(player.y-l.pos); if(d<1.15) damagePlayer(); }
      if(Math.random()<0.5) spawnP(l.dir==='v'?l.pos:rand(-BX,BX)*1.5,l.dir==='h'?l.pos:rand(-BY,BY)*1.5,rand(-60,5),rand(-6,6),rand(-6,6),30,0.3,1.2,1,0.5,0.8,2); }
    else { const k=1-(l.t-T2)/0.25; w=2.5*k; cw=0.75*k; op=0.85*k; cop=k; }
    if(l.t>=T3||l.kill){ scene.remove(l.g); l.outer.material.dispose(); l.core.material.dispose(); lasers.splice(i,1); continue; }
    const L=140,H=120;
    if(l.dir==='v'){ l.outer.scale.set(w,H,L); l.core.scale.set(cw,H,L); } else { l.outer.scale.set(H,w,L); l.core.scale.set(H,cw,L); }
    l.outer.material.opacity=op; l.core.material.opacity=cop;
  }
}

function setPhase(p){
  G.phase=p; G.phaseT=0; G.si=0; G.script=SCRIPT[p]||null;
  if(p==='zako1'){ SND.music('normal',true); }
  if(p==='warn1'||p==='warn2'){ showWarning(p==='warn1'?'MID-CLASS TARGET INBOUND':'HUGE BATTLESHIP APPROACHING'); SND.music('warn',true); if(p==='warn2'){ G.ringMode=false; G.targetSpeed=150; } }
  if(p==='clear'){ SND.fanfare(); showMsg('MISSION COMPLETE','ワープアウト',2.2); }
}
function updatePhase(dt){
  G.phaseT+=dt; const T=G.phaseT;
  if(G.script){ while(G.si<G.script.length&&T>=G.script[G.si][0]){ G.script[G.si][1](); G.si++; } }
  const live=enemies.filter(e=>e.alive).length;
  switch(G.phase){
    case 'intro':
      if(T<2.5){ G.speed=3400; G.targetSpeed=3400; G.fovKick=36+Math.sin(T*30)*2; G.shake=Math.max(G.shake,0.35);
        player.z=lerp(26,0,easeOut(T/2.3)); streakMat.color.setRGB(0.8,0.9,1.8); }
      else if(!G.exited){ G.exited=true; G.targetSpeed=150; G.speedK=3.2; G.flash=1; G.flashCol='#e8f6ff'; G.shake=2.2; G.fovKick=22; SND.warpExit();
        shock(0,1,-30,40,0x3ff0ff,0.9); shock(0,1,-30,26,0xff2fa0,0.7); flashAt(0,1,-30,60,0xbfefff); streakMat.color.setRGB(1,1,1);
        later(0.35,()=>showMsg('STAGE 01','ORBITAL FRONT',2.0)); }
      if(T>3.8) setPhase('zako1');
      break;
    case 'zako1': G.playTime+=dt; if((T>16&&live===0)||T>19.5) setPhase('warn1'); break;
    case 'warn1': G.playTime+=dt; if(T>2.6){ setPhase('mid'); spawnMid(); } break;
    case 'mid': G.playTime+=dt; break;
    case 'zako2': G.playTime+=dt; if((T>8.5&&live===0)||T>11) setPhase('warn2'); break;
    case 'warn2': G.playTime+=dt; if(T>2.8){ setPhase('boss'); spawnBoss(); } break;
    case 'boss': G.playTime+=dt; break;
    case 'bossDeath': break;
    case 'clear':
      player.z-=dt*(T<0.9?4:20+T*T*260); pObj.userData.flames.forEach(f=>f.scale.set(1.4,1.4,2.5+T*2));
      if(T>0.9&&!G.warpOut){ G.warpOut=true; G.targetSpeed=3400; G.speedK=1.8; SND.warp(); }
      if(T>0.9) G.fovKick=Math.max(G.fovKick,Math.min(38,(T-0.9)*40));
      if(T>2.6&&!G.flashed){ G.flashed=true; G.flash=1; G.flashCol='#ffffff'; SND.warpExit(); pObj.visible=false; }
      if(T>3.2&&G.state==='play'){ G.state='result'; showResult(); }
      break;
  }
}

/* =================== MAIN LOOP =================== */
const camBase={x:0,y:3};
let lastT=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const raw=Math.min((now-lastT)/1000,0.05); lastT=now;
  if(G.slowT>0){ G.slowT-=raw; }
  const dt=raw*(G.slowT>0?0.3:1);
  G.t+=dt;
  if(G.state==='play') updatePhase(dt);
  runTimers(dt);

  // speed & scenery
  if(!(G.state==='play'&&G.phase==='intro'&&G.phaseT<2.5)) G.speed=lerp(G.speed,G.targetSpeed,1-Math.exp(-dt*G.speedK));
  if(G.state==='title'){ G.targetSpeed=160; }
  G.dist+=G.speed*dt;
  const len=Math.min(G.speed*0.032,160)+0.6;
  for(let i=0;i<STREAKS;i++){ const d=sDat[i]; d.z+=G.speed*dt; if(d.z>22) resetStreak(d,false);
    sPos[i*6]=d.x; sPos[i*6+1]=d.y; sPos[i*6+2]=d.z; sPos[i*6+3]=d.x; sPos[i*6+4]=d.y; sPos[i*6+5]=d.z-len; }
  streakGeo.attributes.position.needsUpdate=true;
  grid.position.z=-250+(G.dist%10); grid2.position.z=-250+(G.dist%20);
  if(G.ringMode){ G.ringTimer-=dt; if(G.ringTimer<=0){ G.ringTimer=0.32; const m=tRings[ringIdx]; ringIdx=(ringIdx+1)%tRings.length; m.visible=true; m.position.set(0,1,-480); m.scale.setScalar(1); } }
  for(const m of tRings){ if(!m.visible) continue; m.position.z+=G.speed*dt; m.rotation.z+=dt*0.5; if(m.position.z>30) m.visible=false; }
  for(const a of asts){ a.m.position.z+=G.speed*dt; a.m.rotation.x+=a.rx*dt; a.m.rotation.y+=a.ry*dt; if(a.m.position.z>40) placeAst(a.m,false); }
  G.rage=lerp(G.rage,G.rageTarget,1-Math.exp(-dt*2)); skyMat.uniforms.rage.value=G.rage; skyMat.uniforms.t.value=G.t;
  if(bloom) bloom.strength=0.85+G.rage*0.3;

  // player
  const playing=G.state==='play'&&player.alive;
  const canMove=playing&&G.phase!=='clear';
  if(canMove){
    const kx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0), ky=(keys.ArrowUp||keys.KeyW?1:0)-(keys.ArrowDown||keys.KeyS?1:0);
    ctrl.x+=kx*BX*1.9*dt; ctrl.y+=ky*BY*1.9*dt;
  }
  ctrl.x=clamp(ctrl.x,-BX,BX); ctrl.y=clamp(ctrl.y,-BY,BY);
  if(G.state==='title'){ ctrl.x=Math.sin(G.t*0.7)*BX*0.4; ctrl.y=Math.sin(G.t*1.1)*BY*0.3; player.z=0; }
  const ox=player.x,oy=player.y,k=1-Math.exp(-dt*16);
  player.x+=(ctrl.x-player.x)*k; player.y+=(ctrl.y-player.y)*k;
  const vx=(player.x-ox)/Math.max(dt,1e-4), vy=(player.y-oy)/Math.max(dt,1e-4);
  player.bank=lerp(player.bank,clamp(-vx*0.055,-0.95,0.95),1-Math.exp(-dt*10));
  player.pitch=lerp(player.pitch,clamp(vy*0.03,-0.4,0.4),1-Math.exp(-dt*10));
  pObj.position.set(player.x,player.y+Math.sin(G.t*3)*0.06,player.z);
  pObj.rotation.set(player.pitch,0,player.bank);
  if(player.alive&&!(G.phase==='clear'&&G.flashed)) pObj.visible=!(G.invuln>0&&Math.floor(G.t*22)%2===0);
  if(G.invuln>0) G.invuln-=dt;
  if(G.phase!=='clear') pObj.userData.flames.forEach(f=>{ const s=0.85+Math.random()*0.35+(G.speed>1000?1:0); f.scale.set(1,1,s); });
  const mz=pObj.userData.muzzle; mz.material.opacity*=Math.exp(-dt*30);
  if(pObj.visible&&Math.random()<0.5) for(const s of [-0.45,0.45]) spawnP(player.x+s,player.y-0.05,player.z+2.3,rand(-.5,.5),rand(-.5,.5),40+G.speed*0.1,0.14,0.4,0.12,0.35,0.6,1);

  // firing
  const firing=playing&&!['intro','clear','bossDeath'].includes(G.phase);
  if(firing){ G.fireT-=dt; if(G.fireT<=0){ G.fireT=0.085; firePlayer(); } }
  if(G.state==='play') pickLock(); else lock=null;
  if(lock&&lock.alive){ reticle.visible=true; reticle.position.copy(lock.pos); if(lock.boss) reticle.position.z+=lock.boss==='final'?4:2;
    const sc=(lock.boss?8:4)+Math.sin(G.t*12)*0.4; reticle.scale.setScalar(sc); reticle.material.rotation=G.t*1.5; } else reticle.visible=false;

  updatePBullets(dt);
  for(const e of enemies){ if(!e.alive) continue; e.t+=dt; e.update(e,dt); if(!e.alive) continue;
    e.hitT-=dt; e.flash.material.opacity=e.hitT>0?0.9:0;
    if(!e.boss&&player.alive&&G.invuln<=0&&Math.abs(e.pos.z-player.z)<e.hz+0.6&&Math.abs(e.pos.x-player.x)<e.hx*0.7&&Math.abs(e.pos.y-player.y)<e.hy*0.7){ damagePlayer(); destroyEnemy(e); } }
  for(let i=enemies.length-1;i>=0;i--) if(!enemies[i].alive) enemies.splice(i,1);
  updateEBullets(dt); updateLasers(dt); updateItems(dt); updateFx(dt); updateParticles(dt);

  // camera
  const ck=1-Math.exp(-dt*4);
  camBase.x=lerp(camBase.x,player.x*0.6,ck); camBase.y=lerp(camBase.y,player.y*0.55+2.8,ck);
  const sh=G.shake;
  camera.position.set(camBase.x+(Math.random()-0.5)*sh,camBase.y+(Math.random()-0.5)*sh,14);
  camera.lookAt(camBase.x*0.5,camBase.y*0.5-1,-40);
  camera.rotateZ(-player.bank*0.12);
  camera.fov=baseFov+G.fovKick; camera.updateProjectionMatrix();
  G.shake*=Math.exp(-raw*7); if(G.shake<0.01) G.shake=0;
  if(!(G.phase==='intro'&&G.phaseT<2.5)) G.fovKick*=Math.exp(-raw*2.4);
  G.flash*=Math.exp(-raw*3.2); if(G.flash<0.004) G.flash=0;
  sky.position.copy(camera.position);

  updateHUD();
  if(composer) composer.render(); else renderer.render(scene,camera);
}
showTitle();
requestAnimationFrame(frame);
})();
</script>
