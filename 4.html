<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2a74cf">
<title>Golog Golf 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#9ccbee;
  --panel:rgba(9,24,38,.5);
  --ink:#ffffff;
  --sub:rgba(255,255,255,.76);
  --line:rgba(255,255,255,.22);
  --card:#ffffff;
  --card-ink:#132330;
  --card-sub:#5b6d7a;
  --card-line:#e3eaef;
  --navy:#1b6fa8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1a25; --panel:rgba(6,14,22,.6);
    --card:#142330; --card-ink:#eaf2f7; --card-sub:#93a7b6; --card-line:#223747;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1a25; --panel:rgba(6,14,22,.6);
  --card:#142330; --card-ink:#eaf2f7; --card-sub:#93a7b6; --card-line:#223747;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Noto Sans JP',system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.num{font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;font-weight:800;letter-spacing:.2px}
.panel{background:var(--panel);-webkit-backdrop-filter:blur(12px) saturate(1.25);backdrop-filter:blur(12px) saturate(1.25);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,20,40,.22)}

/* ---------- 上部HUD ---------- */
.hud-top{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;pointer-events:none;transition:opacity .3s}
.hole{justify-self:start;padding:8px 12px 9px;min-width:92px}
.hole .no{font-size:32px;line-height:.82}
.hole .no span{font-size:13px;opacity:.72;margin-right:4px;font-weight:700}
.hole .meta{margin-top:5px;font-size:11px;font-weight:700;color:var(--sub);display:flex;gap:8px}
.hole .stroke{margin-top:6px;font-size:11px;font-weight:700;display:flex;align-items:baseline;gap:6px;color:var(--sub)}
.hole .stroke b{font-size:22px;color:#fff;line-height:.9}
.pin{justify-self:center;padding:7px 14px 8px;text-align:center;min-width:116px}
.pin .lbl{font-size:10px;font-weight:700;color:var(--sub)}
.pin .d{font-size:40px;line-height:.88}
.pin .d small{font-size:16px;margin-left:2px;opacity:.8}
.pin .row{display:flex;justify-content:center;gap:6px;margin-top:5px;align-items:center}
.chip{font-size:10px;font-weight:900;padding:3px 8px;border-radius:999px;background:#7fdc6a;color:#10301a}
.elev{font-size:10.5px;font-weight:700;color:var(--sub);white-space:nowrap}
.right{justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.wind{width:80px;padding:6px 6px 7px;text-align:center}
.wind .lbl{font-size:10px;font-weight:700;color:var(--sub)}
.wind svg{width:46px;height:46px;display:block;margin:2px auto 1px}
.wind .spd{font-size:19px;line-height:1}
.wind .spd small{font-size:11px;opacity:.8;margin-left:1px}
.iconbtn{pointer-events:auto;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;transition:background .15s}
.iconbtn.on{background:rgba(255,205,46,.92);color:#3a2600;border-color:transparent}

/* ---------- 下部HUD ---------- */
.hud-bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none;transition:opacity .3s}
.hud-bottom.busy .controls{opacity:.45}
.gauge{position:relative;height:30px;border-radius:15px;background:linear-gradient(180deg,rgba(5,12,20,.74),rgba(5,12,20,.56));
  border:1px solid var(--line);overflow:hidden;margin:0 0 10px;box-shadow:inset 0 2px 6px rgba(0,0,0,.35)}
.g-fill{position:absolute;top:4px;bottom:4px;left:6%;width:0;border-radius:4px;
  background:linear-gradient(90deg,#39d98a 0%,#ffd23f 62%,#ff7a2f 92%,#ff3d57 100%)}
.g-tick{position:absolute;top:7px;bottom:7px;width:1px;background:rgba(255,255,255,.3)}
.g-impact{position:absolute;top:0;bottom:0;left:calc(6% - 6px);width:12px;background:rgba(255,255,255,.16);
  border-left:1px solid rgba(255,255,255,.35);border-right:1px solid rgba(255,255,255,.35)}
.g-impact::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff}
.g-target{position:absolute;top:3px;bottom:3px;width:0;border-left:2px dashed rgba(255,255,255,.9);display:none}
.g-power{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#ff4d6d;box-shadow:0 0 8px #ff4d6d;display:none}
.g-marker{position:absolute;top:-1px;bottom:-1px;left:6%;width:5px;margin-left:-2.5px;border-radius:3px;background:#fff;box-shadow:0 0 12px #fff,0 0 2px #000}
.g-text{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:16px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.g-hint{position:absolute;left:calc(6% + 14px);top:50%;transform:translateY(-50%);font-size:10.5px;font-weight:700;color:rgba(255,255,255,.72);white-space:nowrap}
.controls{display:flex;align-items:center;gap:8px;transition:opacity .2s}
.aim{pointer-events:auto;flex:none;width:50px;height:58px;border-radius:14px;display:grid;place-items:center}
.aim:active,.club button:active{background:rgba(255,255,255,.28)}
.club{pointer-events:auto;flex:1;min-width:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 3px}
.club button{width:34px;height:48px;border-radius:10px;display:grid;place-items:center;flex:none}
.club .mid{text-align:center;line-height:1;min-width:0}
.club .nm{font-size:27px}
.club .ds{font-size:10.5px;font-weight:700;color:var(--sub);margin-top:3px;white-space:nowrap}
.shot{pointer-events:auto;flex:none;width:86px;height:86px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#fff0a8 0%,#ffcd2e 45%,#e89400 100%);color:#3b2500;font-size:24px;line-height:1;
  border:3px solid rgba(255,255,255,.78);box-shadow:0 10px 26px rgba(229,150,0,.45),inset 0 -5px 0 rgba(0,0,0,.14);transition:transform .08s}
.shot:active{transform:scale(.93)}
.shot.hot{background:radial-gradient(circle at 34% 28%,#ffd1d6 0%,#ff5f73 50%,#d81b3b 100%);color:#fff;
  box-shadow:0 10px 26px rgba(216,27,59,.45),inset 0 -5px 0 rgba(0,0,0,.14)}
.shot small{display:block;font-size:10px;font-family:'Noto Sans JP',sans-serif;font-weight:900;margin-top:3px;opacity:.82}
.dim .hud-top,.dim .hud-bottom{opacity:0;pointer-events:none}
.dim .hud-top *,.dim .hud-bottom *{pointer-events:none!important}
.hidden{display:none!important}

/* ---------- トースト ---------- */
.toast{position:fixed;left:50%;top:38%;z-index:8;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;width:92%}
.toast.show{animation:pop 2s ease forwards}
.toast .big{font-size:54px;line-height:.9;text-shadow:0 4px 0 rgba(0,0,0,.16),0 10px 34px rgba(0,0,0,.35)}
.toast .sub{margin-top:9px;font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:900;letter-spacing:0;text-shadow:0 2px 12px rgba(0,0,0,.55)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
  22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
@media (prefers-reduced-motion: reduce){.toast.show{animation:fadeonly 2s ease forwards}@keyframes fadeonly{0%,80%{opacity:1}100%{opacity:0}}}

/* ---------- オーバーレイ ---------- */
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:end center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);
  background:linear-gradient(180deg,rgba(6,18,30,0) 30%,rgba(6,18,30,.55))}
.card{width:100%;max-width:420px;background:var(--card);color:var(--card-ink);border-radius:24px;padding:22px 20px 18px;box-shadow:0 24px 60px rgba(0,10,25,.45)}
.logo{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8vh);text-align:center;pointer-events:none}
.logo .t{font-size:clamp(52px,15vw,84px);line-height:.8;color:#fff;letter-spacing:1px;text-shadow:0 6px 0 rgba(20,60,110,.35),0 12px 40px rgba(0,30,70,.4)}
.logo .s{margin-top:10px;font-size:13px;font-weight:900;color:#fff;text-shadow:0 2px 12px rgba(0,30,60,.5)}
.how{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px;counter-reset:s}
.how li{counter-increment:s;display:flex;gap:10px;align-items:center;font-size:13.5px;font-weight:500}
.how li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;
  font-weight:900;font-size:12px}
.how b{font-weight:900}
.tips{font-size:12px;color:var(--card-sub);line-height:1.75;margin:0 0 16px}
.primary{width:100%;height:56px;border-radius:16px;background:linear-gradient(180deg,#ffd23f,#f0a500);color:#3b2500;font-size:23px;
  box-shadow:0 8px 20px rgba(240,165,0,.38),inset 0 -4px 0 rgba(0,0,0,.12)}
.primary:active{transform:translateY(1px)}
.result{font-size:46px;text-align:center;line-height:.9}
.rsub{text-align:center;font-size:13px;color:var(--card-sub);font-weight:700;margin-top:8px}
.sc{width:100%;border-collapse:collapse;margin:16px 0 16px;font-size:13px}
.sc th,.sc td{text-align:center;padding:7px 2px;border-bottom:1px solid var(--card-line)}
.sc th{font-size:11px;color:var(--card-sub);font-weight:700}
.sc td.lab{text-align:left;font-weight:700;color:var(--card-sub);font-size:11px;width:56px}
.sc .tot{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:19px}
.mk{display:inline-grid;place-items:center;width:30px;height:30px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px}
.mk.bd{border:2px solid #e8413c;border-radius:50%;color:#e8413c}
.mk.eg{border:2px solid #e8413c;border-radius:50%;color:#e8413c;box-shadow:0 0 0 2px var(--card),0 0 0 4px #e8413c}
.mk.bg{border:2px solid #2e7dd1;border-radius:4px;color:#2e7dd1}
.mk.db{border:2px solid #2e7dd1;border-radius:4px;color:#2e7dd1;box-shadow:0 0 0 2px var(--card),0 0 0 4px #2e7dd1}
.loader{position:fixed;inset:0;z-index:12;display:grid;place-items:center;background:linear-gradient(180deg,#5fa6e0,#c4e5f8)}
.loader .in{text-align:center;color:#fff}
.spin{width:46px;height:46px;border-radius:50%;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;margin:0 auto 14px;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.loader .lt{font-size:14px;font-weight:900;text-shadow:0 2px 10px rgba(0,40,80,.35)}
</style>
</head>
<body class="dim">
<canvas id="c"></canvas>

<div class="hud-top">
  <div class="panel hole">
    <div class="no num"><span>HOLE</span><b id="hNo">1</b></div>
    <div class="meta"><span id="hPar">PAR 4</span><span id="hYd">400Y</span></div>
    <div class="stroke">打数<b class="num" id="hStroke">0</b></div>
  </div>
  <div class="panel pin">
    <div class="lbl">ピンまで</div>
    <div class="d num" id="pinD">0<small>Y</small></div>
    <div class="row"><span class="chip" id="lie">ティー</span><span class="elev" id="elev"></span></div>
  </div>
  <div class="right">
    <div class="panel wind">
      <div class="lbl">風</div>
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="21" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
        <circle cx="24" cy="24" r="13" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
        <path d="M24 3.5v4" stroke="rgba(255,255,255,.6)" stroke-width="2" stroke-linecap="round"/>
        <g id="wArrow"><path d="M24 8 L31.5 23 L26.8 23 L26.8 39 L21.2 39 L21.2 23 L16.5 23 Z" fill="#ffc933" stroke="#3a2600" stroke-width="1" stroke-linejoin="round"/></g>
      </svg>
      <div class="spd num" id="wSpd">0<small>m</small></div>
    </div>
    <button class="panel iconbtn" id="viewBtn" aria-label="落下地点を見る">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
</div>

<div class="hud-bottom" id="hudB">
  <div class="gauge" id="gauge">
    <div class="g-fill" id="gFill"></div>
    <div class="g-impact"></div>
    <div class="g-target" id="gTarget"></div>
    <div class="g-power" id="gPower"></div>
    <div class="g-marker" id="gMarker"></div>
    <div class="g-hint" id="gHint">SHOTを押してスタート</div>
    <div class="g-text num" id="gText"></div>
  </div>
  <div class="controls">
    <button class="panel aim" id="aimL" aria-label="左に向ける">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-2"/></svg>
    </button>
    <div class="panel club">
      <button id="clubPrev" aria-label="長いクラブ"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="mid"><div class="nm num" id="cName">1W</div><div class="ds" id="cDist">235Y</div></div>
      <button id="clubNext" aria-label="短いクラブ"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <button class="panel aim" id="aimR" aria-label="右に向ける">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h2"/></svg>
    </button>
    <button class="shot num" id="shotBtn">SHOT<small id="shotSub">スタート</small></button>
  </div>
</div>

<div class="toast num" id="toast"><div class="big" id="tBig"></div><div class="sub" id="tSub"></div></div>

<div class="overlay hidden" id="title">
  <div class="logo"><div class="t num">GOLOG GOLF</div><div class="s">3ホールのショートラウンド</div></div>
  <div class="card">
    <ol class="how">
      <li><span><b>SHOT</b>を押すとゲージが走り出す</span></li>
      <li><span>もう一度押して<b>パワー</b>を決める</span></li>
      <li><span>戻ってくるマーカーを<b>白いライン</b>で止める</span></li>
    </ol>
    <p class="tips">画面を左右にドラッグするか◀▶で方向を調整。‹ ›でクラブを持ち替え。風と傾斜を読んで、グリーンの点線の流れでラインを読もう。</p>
    <button class="primary num" id="playBtn">PLAY</button>
  </div>
</div>

<div class="overlay hidden" id="cardOv">
  <div class="card" id="cardBody"></div>
</div>

<div class="loader" id="loader"><div class="in"><div class="spin"></div><div class="lt" id="ldText">3Dエンジンを読み込み中…</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE){ $('ldText').textContent='3Dエンジンを読み込めませんでした。通信状況を確認して再読み込みしてください。'; return; }
const V3=THREE.Vector3;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const lc=h=>new THREE.Color(h).convertSRGBToLinear();
const isSmall=Math.min(innerWidth,innerHeight)<700;

/* ================= データ ================= */
const HALF=300, WL=-0.45, G=9.8, R=0.11, SIM=1.3, KW=0.2;
const CLUBS=[
  {id:'1W',dist:235,ang:19,spin:1.0},
  {id:'3W',dist:212,ang:21,spin:0.95},
  {id:'5I',dist:178,ang:26,spin:0.85},
  {id:'7I',dist:152,ang:31,spin:0.78},
  {id:'9I',dist:128,ang:37,spin:0.7},
  {id:'PW',dist:108,ang:42,spin:0.62},
  {id:'SW',dist:78, ang:50,spin:0.55},
  {id:'PT',dist:0,  ang:0, spin:0},
];
const SURF={
  tee:    {name:'ティー',      e:.22,h:.42,mu:8,  mul:1,   col:'#9ee07a'},
  fairway:{name:'フェアウェイ',e:.22,h:.42,mu:8,  mul:1,   col:'#7fdc6a'},
  fringe: {name:'カラー',      e:.14,h:.36,mu:3.2,mul:.95, col:'#a8e682'},
  green:  {name:'グリーン',    e:.12,h:.32,mu:1.6,mul:1,   col:'#c2f59a'},
  rough:  {name:'ラフ',        e:.12,h:.25,mu:15, mul:.85, col:'#4f9a3a'},
  bunker: {name:'バンカー',    e:.02,h:.06,mu:38, mul:.7,  col:'#f0d9a0'},
  water:  {name:'池',          e:0,h:0,mu:99,mul:0,col:'#5bb2e8'},
  ob:     {name:'OB',          e:0,h:0,mu:99,mul:0,col:'#ffffff'},
};
const HOLES=[
  {name:'グリーンヒル', par:4, seed:1.3, fw:34, fwStart:55,
   pts:[[0,205],[0,70],[16,-60],[12,-178]], green:{x:12,z:-190,r:14}, pin:{x:15,z:-193}, tilt:[0.022,-0.014],
   bunkers:[{x:-24,z:-30,rx:10,rz:7,a:.4},{x:36,z:-140,rx:8,rz:11,a:.2},{x:-6,z:-207,rx:7,rz:5,a:0},{x:29,z:-196,rx:5,rz:7,a:.5}],
   ponds:[]},
  {name:'レイクサイド', par:3, seed:2.7, fw:24, fwStart:122,
   pts:[[0,92],[0,-40],[-3,-75]], green:{x:-4,z:-85,r:15}, pin:{x:-8,z:-89}, tilt:[-0.026,0.018],
   bunkers:[{x:19,z:-93,rx:6,rz:8,a:.3},{x:-24,z:-74,rx:6,rz:5,a:.2},{x:-3,z:-106,rx:9,rz:4,a:0}],
   ponds:[{x:0,z:2,rx:42,rz:36}]},
  {name:'ロングドッグ', par:5, seed:4.1, fw:38, fwStart:60,
   pts:[[40,255],[40,110],[22,-10],[-38,-125],[-66,-238]], green:{x:-70,z:-252,r:16}, pin:{x:-66,z:-256}, tilt:[0.018,0.026],
   bunkers:[{x:66,z:60,rx:11,rz:8,a:.3},{x:-4,z:-40,rx:9,rz:9,a:0},{x:-52,z:-233,rx:7,rz:6,a:.4},{x:-92,z:-258,rx:6,rz:8,a:.1}],
   ponds:[{x:12,z:-150,rx:22,rz:30}]},
];

/* ================= コース形状 ================= */
let H=null, SEG=[], PR_D=0, PR_T=0;
function baseRaw(x,z){const s=H.seed;return 1.5*Math.sin(x*0.019+s)*Math.cos(z*0.015+s*0.5)+0.9*Math.sin(z*0.027+x*0.011+s*2)+0.45*Math.sin(x*0.052+z*0.041+s*3);}
function prepHole(def){

  if(sp>1e-6){const f=Math.min(P.mu*h,sp);v.x+=ax*h-v.x/sp*f;v.z+=az*h-v.z/sp*f;}else{v.x+=ax*h;v.z+=az*h;}
  p.x+=v.x*h;p.z+=v.z*h;p.y=Hgt(p.x,p.z)+R;
  const d=Math.hypot(p.x-H.pin.x,p.z-H.pin.z),sp2=Math.hypot(v.x,v.z);
  if(d<0.14&&sp2<2.4){holeOut();return;}
  if(d<0.2&&sp2>=2.4){v.multiplyScalar(0.92);}
  if(S.rollT>30){v.set(0,0,0);stopBall();}}
function stopBall(){S.mode='wait';S.wait=1.0;}
function penalty(kind){S.mode='pen';S.strokes++;S.wait=1.8;S.vel.set(0,0,0);
  if(kind==='water'){sfx.splash();emit(S.ball,['#ffffff','#bfe6ff','#7cc6f2'],60,2.2,5);S.ball.y=WL-0.2;toast('WATER','池に入りました。1打罰で打ち直し','#9fdcff');}
  else toast('OB','コース外に出ました。1打罰で打ち直し','#ffffff');hud();}
function scoreName(diff,st){if(st===1)return ['HOLE IN ONE!','ホールインワン'];
  const m={'-3':['ALBATROSS','アルバトロス'],'-2':['EAGLE','イーグル'],'-1':['BIRDIE','バーディー'],'0':['PAR','パー'],'1':['BOGEY','ボギー'],'2':['DOUBLE BOGEY','ダブルボギー'],'3':['TRIPLE BOGEY','トリプルボギー']};
  return m[String(diff)]||(diff<-3?['CONDOR','コンドル']:['+'+diff,diff+'オーバー']);}
function holeOut(){S.mode='holed';S.scores[S.hole]=S.strokes;sfx.cup();const d=S.strokes-H.par,nm=scoreName(d,S.strokes);
  toast(nm[0],nm[1]+'（'+S.strokes+'打）',d<0?'#ffd23f':'#ffffff');if(d<0||S.strokes===1)sfx.cheer();
  emit(S.pinPos,['#ffd23f','#ffffff','#ff6b6b','#6fd3ff'],70,2.6,6);hud();setTimeout(showCard,2600);}

/* ================= スコアカード ================= */
function mark(sc,par){if(sc==null)return '<span class="mk">-</span>';const d=sc-par;const cls=d<=-2?'eg':d===-1?'bd':d===1?'bg':d>=2?'db':'';return '<span class="mk '+cls+'">'+sc+'</span>';}
function showCard(){
  S.mode='card';document.body.classList.add('dim');const last=S.hole===HOLES.length-1;
  let hdr='<th></th>',pr='<td class="lab">PAR</td>',sr='<td class="lab">スコア</td>',tp=0,ts=0;
  HOLES.forEach((h,i)=>{hdr+='<th>'+(i+1)+'</th>';pr+='<td>'+h.par+'</td>';sr+='<td>'+mark(S.scores[i],h.par)+'</td>';tp+=h.par;if(S.scores[i]!=null)ts+=S.scores[i];});
  hdr+='<th>計</th>';pr+='<td class="tot">'+tp+'</td>';sr+='<td class="tot">'+(ts||'-')+'</td>';
  const sc=S.scores[S.hole],d=sc-H.par,nm=scoreName(d,sc);
  let top;
  if(last){const played=HOLES.reduce((a,h,i)=>a+(S.scores[i]!=null?h.par:0),0),diff=ts-played;
    top='<div class="result num">'+ts+'<span style="font-size:22px;margin-left:6px;color:var(--card-sub)">'+(diff===0?'E':(diff>0?'+':'')+diff)+'</span></div><div class="rsub">ラウンド終了。3ホールのトータルスコアです</div>';}
  else top='<div class="result num" style="color:'+(d<0?'#e8413c':'var(--card-ink)')+'">'+nm[0]+'</div><div class="rsub">HOLE '+(S.hole+1)+'　'+nm[1]+'　'+sc+'打</div>';
  $('cardBody').innerHTML=top+'<table class="sc"><tr>'+hdr+'</tr><tr>'+pr+'</tr><tr>'+sr+'</tr></table><button class="primary num" id="cardBtn">'+(last?'もう一度プレー':'HOLE '+(S.hole+2)+'へ')+'</button>';
  $('cardOv').classList.remove('hidden');
  $('cardBtn').onclick=()=>{ac();$('cardOv').classList.add('hidden');const next=last?0:S.hole+1;if(last)S.scores=[];goHole(next);};}
function goHole(i){$('ldText').textContent='HOLE '+(i+1)+' を準備中…';$('loader').classList.remove('hidden');
  setTimeout(()=>{loadHole(i);$('loader').classList.add('hidden');document.body.classList.remove('dim');startHole();},40);}

/* ================= ホール読み込み ================= */
function loadHole(i){
  S.hole=i;prepHole(HOLES[i]);disposeGroup(holeGroup);
  buildTerrain();buildWater();buildTrees();buildPin();buildGreenGrid();
  S.strokes=0;S.ball.set(H.tee.x,Hgt(H.tee.x,H.tee.z)+R,H.tee.z);S.last.copy(S.ball);
  const base=[1.2,2,2.5][i]||2,spd=base+Math.random()*3,ang=Math.random()*Math.PI*2;
  S.wind={spd,ang,x:Math.sin(ang)*spd,z:-Math.cos(ang)*spd};
  flagGroup.rotation.y=Math.atan2(Math.cos(ang),Math.sin(ang));
  S.pinPos.set(H.pin.x,Hgt(H.pin.x,H.pin.z),H.pin.z);
  S.orbitC.set((H.tee.x+H.green.x)/2,Hgt((H.tee.x+H.green.x)/2,(H.tee.z+H.green.z)/2),(H.tee.z+H.green.z)/2);
  ball.visible=true;trail.visible=false;arcPts.visible=false;ring.visible=false;}
function startHole(){setShadow(72);setupShot();S.snap=true;toast('HOLE '+(S.hole+1),'PAR '+H.par+'　'+Math.round(H.len)+'Y　'+H.name,'#ffffff');}

/* ================= カメラ ================= */
const camPos=new V3(),camLook=new V3(),dPos=new V3(),dLook=new V3();
function updateCamera(dt){const b=S.ball;let k;
  if(S.mode==='title'||S.mode==='boot'){const c=S.orbitC,a=T*0.07;dPos.set(c.x+Math.sin(a)*210,c.y+100,c.z+Math.cos(a)*210);dLook.copy(c);k=1-Math.exp(-dt*1.4);}
  else if(S.mode==='aim'){const f=aimDir(tmpF),putt=isPutt();
    if(S.view==='target'&&!putt){const t=S.targetPt;dPos.set(t.x-f.x*26,t.y+30,t.z-f.z*26);dLook.copy(t);}
    else if(putt){const dp=Math.min(distPin(),20);dPos.set(b.x-f.x*(3.6+dp*0.14),b.y+1.3+dp*0.08,b.z-f.z*(3.6+dp*0.14));dLook.set(b.x+f.x*Math.max(3,dp*0.8),b.y-0.2,b.z+f.z*Math.max(3,dp*0.8));}
    else{dPos.set(b.x-f.x*8.5,b.y+3.2,b.z-f.z*8.5);dLook.set(b.x+f.x*36,b.y+1.6,b.z+f.z*36);}
    k=1-Math.exp(-dt*3.4);}
  else if(S.mode==='flight'){if(S.flightT>0.55){hv.set(S.vel.x,0,S.vel.z);if(hv.lengthSq()>0.5)S.hdir.copy(hv.normalize());
      dPos.set(b.x-S.hdir.x*12,b.y+4.2,b.z-S.hdir.z*12);dLook.set(b.x+S.hdir.x*5,b.y,b.z+S.hdir.z*5);}else dLook.copy(b);k=1-Math.exp(-dt*4.5);}
  else if(S.mode==='holed'||S.mode==='card'){const p=S.pinPos,a=T*0.25;dPos.set(p.x+Math.sin(a)*6.5,p.y+2.6,p.z+Math.cos(a)*6.5);dLook.set(p.x,p.y+0.6,p.z);k=1-Math.exp(-dt*1.8);}
  else{hv.set(S.vel.x,0,S.vel.z);if(hv.lengthSq()>0.01)S.hdir.copy(hv.normalize());const back=isPutt()?4.5:7;
    dPos.set(b.x-S.hdir.x*back,b.y+(isPutt()?1.8:3),b.z-S.hdir.z*back);dLook.copy(b);k=1-Math.exp(-dt*2.6);}
  if(S.snap){k=1;S.snap=false;}
  camPos.lerp(dPos,k);camLook.lerp(dLook,k);const gy=Hgt(camPos.x,camPos.z)+1.0;if(camPos.y<gy)camPos.y=gy;
  camera.position.copy(camPos);camera.lookAt(camLook);}

/* ================= ループ ================= */
function updateTrail(){const n=trailPts.length;if(n<2){trail.visible=false;return;}trail.visible=true;const a=trailGeo.attributes.position.array;
  for(let i=0;i<n;i++){const p=trailPts[i],pv=trailPts[Math.max(0,i-1)],nx=trailPts[Math.min(n-1,i+1)];
    tanV.subVectors(nx,pv);toC.subVectors(camera.position,p);sideV.crossVectors(tanV,toC);const L=sideV.length()||1;
    const w=0.07*(0.25+0.75*i/(n-1))*clamp(p.distanceTo(camera.position)/14,1,6)/L;
    a[i*6]=p.x+sideV.x*w;a[i*6+1]=p.y+sideV.y*w;a[i*6+2]=p.z+sideV.z*w;a[i*6+3]=p.x-sideV.x*w;a[i*6+4]=p.y-sideV.y*w;a[i*6+5]=p.z-sideV.z*w;}
  trailGeo.attributes.position.needsUpdate=true;trailGeo.setDrawRange(0,(n-1)*6);}
function update(dt){
  T+=dt;timeU.value=T;updateFlag();updateGauge(dt);
  if(S.mode==='aim'&&S.gauge.ph==='idle'&&S.aimHold){S.holdT+=dt;S.aim+=S.aimHold*(isPutt()?0.11:0.3)*Math.min(1,0.15+S.holdT*1.6)*dt;S.dirty=true;}
  if(S.mode==='aim'&&S.dirty)predict();
  if(S.mode==='aim')windUI();
  if(S.mode==='flight'||S.mode==='roll'){const total=dt*SIM,steps=Math.ceil(total/(1/120)),h=total/steps;
    for(let i=0;i<steps;i++){if(S.mode==='flight')stepFlight(h);else if(S.mode==='roll')stepRoll(h);else break;}
    if(S.mode==='flight'||S.mode==='roll'){S.trailAcc+=dt;if(S.mode==='flight'&&S.trailAcc>0.03){S.trailAcc=0;trailPts.push(S.ball.clone());if(trailPts.length>TR_MAX)trailPts.shift();}}}
  else if(S.mode==='wait'||S.mode==='pen'){S.wait-=dt;if(S.wait<=0){
    if(S.mode==='pen'){S.ball.copy(S.last);S.ball.y=Hgt(S.ball.x,S.ball.z)+R;}
    if(S.strokes>=H.par*2+2){S.mode='holed';S.scores[S.hole]=H.par*2+3;toast('PICK UP','規定打数に達したのでホールアウト','#ffffff');setTimeout(showCard,1600);}
    else setupShot();}}
  else if(S.mode==='holed'){const b=S.ball,p=S.pinPos;if(b.distanceTo(p)<3){b.x+=(p.x-b.x)*Math.min(1,dt*10);b.z+=(p.z-b.z)*Math.min(1,dt*10);b.y-=dt*0.6;if(b.y<p.y-0.3)ball.visible=false;}}
  updateParts(dt);updateFlow(dt);updateTrail();
  ball.position.copy(S.ball);
  updateCamera(dt);
  ball.scale.setScalar(clamp(camera.position.distanceTo(ball.position)/16,1,8));
  const focus=(S.mode==='title'||S.mode==='boot')?S.orbitC:S.ball;
  sun.target.position.copy(focus);sun.position.copy(focus).addScaledVector(SUN_DIR,280);
  sky.position.copy(camera.position);
  if(Math.floor(T*10)!==Math.floor((T-dt)*10)&&S.mode!=='title'&&S.mode!=='boot')hud();}
let lastT=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(0.05,Math.max(0,(now-lastT)/1000));lastT=now;if(H)update(dt);renderer.render(scene,camera);}

/* ================= 入力 ================= */
$('shotBtn').addEventListener('pointerdown',e=>{e.preventDefault();shotPress();});
function holdBtn(id,dir){const el=$(id);const on=e=>{e.preventDefault();if(S.mode!=='aim'||S.gauge.ph!=='idle')return;S.aimHold=dir;S.holdT=0;S.view='behind';};
  const off=()=>{S.aimHold=0;};el.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,off));}
holdBtn('aimL',-1);holdBtn('aimR',1);
function changeClub(d){if(S.mode!=='aim'||S.gauge.ph!=='idle')return;const l=S.clubs;let k=l.indexOf(S.club);k=(k+d+l.length)%l.length;S.club=l[k];
  if(isPutt())S.puttMax=calcPuttMax();autoAim();gridVis();S.dirty=true;sfx.tick();hud();}
$('clubPrev').addEventListener('click',()=>{ac();changeClub(-1);});$('clubNext').addEventListener('click',()=>{ac();changeClub(1);});
$('viewBtn').addEventListener('click',()=>{if(S.mode!=='aim'||isPutt())return;S.view=S.view==='target'?'behind':'target';hud();});
let drag=null;
canvas.addEventListener('pointerdown',e=>{if(S.mode!=='aim'||S.gauge.ph!=='idle')return;drag={x:e.clientX,id:e.pointerId};try{canvas.setPointerCapture(e.pointerId);}catch(_){}});
canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;if(S.mode!=='aim'||S.gauge.ph!=='idle'){drag=null;return;}
  const dx=e.clientX-drag.x;drag.x=e.clientX;S.aim+=dx*(isPutt()?0.0012:0.003);S.dirty=true;});
['pointerup','pointercancel'].forEach(t=>canvas.addEventListener(t,()=>{drag=null;}));
addEventListener('keydown',e=>{if(e.repeat&&e.code==='Space')return;
  if(e.code==='Space'){e.preventDefault();shotPress();}
  else if(e.code==='ArrowLeft'||e.code==='ArrowRight'){if(S.mode==='aim'&&S.gauge.ph==='idle'&&!S.aimHold){S.aimHold=e.code==='ArrowLeft'?-1:1;S.holdT=0;}}
  else if(e.code==='ArrowUp')changeClub(-1);else if(e.code==='ArrowDown')changeClub(1);
  else if(e.code==='KeyV')$('viewBtn').click();});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='ArrowRight')S.aimHold=0;});
$('playBtn').addEventListener('click',()=>{ac();$('title').classList.add('hidden');document.body.classList.remove('dim');S.scores=[];startHole();});

/* ================= 起動 ================= */
$('ldText').textContent='コースを生成中…';
setTimeout(()=>{try{loadHole(0);}catch(err){$('ldText').textContent='コースの生成に失敗しました：'+err.message;return;}
  S.mode='title';setShadow(230);$('loader').classList.add('hidden');$('title').classList.remove('hidden');hud();
  const c=S.orbitC;camPos.set(c.x+210,c.y+100,c.z);camLook.copy(c);requestAnimationFrame(frame);},60);
})();
</script>
