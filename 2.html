<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#e9e6ef; --ink:#1c1726; --sub:#6a6378; --panel:#15111d; --panelInk:#efe6d8; --line:#2c2638;
  --accent:#f2cf6a; --accent2:#c8102e;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#0b0910; --ink:#efe8f6; --sub:#8b8398; }
}
:root[data-theme="dark"]{ --page:#0b0910; --ink:#efe8f6; --sub:#8b8398; }
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--page);color:var(--ink);font-family:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',sans-serif;-webkit-tap-highlight-color:transparent;}
body[data-machine="abyss"]{--accent:#8ff6ff;--accent2:#1a7fa0;}
.wrap{max-width:420px;margin:0 auto;padding:10px 10px 28px;}
.tabs{display:flex;gap:6px;margin-bottom:10px;}
.tab{flex:1;border:0;border-radius:12px;padding:10px 6px 8px;font:inherit;cursor:pointer;background:#231d2e;color:#a9a0b8;line-height:1.2;}
.tab b{display:block;font-family:'Dela Gothic One',sans-serif;font-weight:400;font-size:13px;letter-spacing:.02em;white-space:nowrap;}
.tab small{font-size:10px;letter-spacing:.08em;}
.tab[aria-selected="true"][data-id="raijin"]{background:linear-gradient(160deg,#9a1f1a,#3d0508);color:#ffe39a;box-shadow:0 0 0 2px #f2cf6a inset;}
.tab[aria-selected="true"][data-id="jin"]{background:linear-gradient(160deg,#3a0808,#0e0605);color:#f3e6d0;box-shadow:0 0 0 2px #c9a24a inset;}
body[data-machine="jin"]{--accent:#e8b84a;}
body[data-machine="jin"] .cab{background:linear-gradient(160deg,#e6dccb,#6a1010 28%,#1a1414 62%,#c9a24a);}
body[data-machine="jin"] .state.hot{background:#3a0a0a;color:#ffd0a0;border-color:#e84a2a;}
.tab[aria-selected="true"][data-id="abyss"]{background:linear-gradient(160deg,#1a6f8a,#041a28);color:#dff9ff;box-shadow:0 0 0 2px #8ff6ff inset;}
.tab:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid #ffd75e;outline-offset:2px;}
.cab{border-radius:22px;padding:8px;background:linear-gradient(160deg,#f4d27a,#9a1f1a 30%,#5a0c0a 65%,#f4d27a);box-shadow:0 14px 30px rgba(0,0,0,.45);}
body[data-machine="abyss"] .cab{background:linear-gradient(160deg,#e8fbff,#3b6e86 30%,#0d2433 65%,#9be8ff);}
.cab-top{display:flex;justify-content:space-between;align-items:center;padding:2px 8px 7px;color:#fff;font-family:'Dela Gothic One',sans-serif;font-size:13px;letter-spacing:.06em;text-shadow:0 1px 0 rgba(0,0,0,.6);}
.cab-top span:last-child{font-family:'DotGothic16',monospace;font-size:11px;opacity:.85;}
.glass{border-radius:14px;overflow:hidden;background:#000;display:flex;justify-content:center;}
canvas{display:block;touch-action:manipulation;}
.panel{margin-top:10px;background:var(--panel);color:var(--panelInk);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;}
.leds{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;}
.led{background:#040b06;border:1px solid #16402a;border-radius:8px;padding:5px 8px;}
.led small{display:block;font-size:9px;color:#4f9e72;letter-spacing:.1em;}
.led b{font-family:'DotGothic16',monospace;font-weight:400;font-size:20px;color:#5dff9f;text-shadow:0 0 8px rgba(93,255,159,.6);}
.state{align-self:flex-start;font-size:12px;font-weight:900;letter-spacing:.06em;padding:4px 12px;border-radius:99px;background:#221c30;color:#aab0ea;border:1px solid #3d3560;}
.state.hot{background:#3a0a1c;color:#ffb1c8;border-color:#ff3b6e;box-shadow:0 0 12px rgba(255,59,110,.45);}
body[data-machine="abyss"] .state.hot{background:#062a38;color:#aef6ff;border-color:#35e6ff;box-shadow:0 0 12px rgba(53,230,255,.45);}

input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,#2458c8 0%,#2458c8 60%,#4a4458 60%,#4a4458 80%,#c8102e 80%);}

.zones span:nth-child(1){flex:60;} .zones span:nth-child(2){flex:20;text-align:center;} .zones span:nth-child(3){flex:20;text-align:right;}
.row{display:flex;gap:8px;align-items:stretch;}
.btn{border:0;border-radius:12px;font:inherit;font-weight:900;cursor:pointer;padding:10px 12px;font-size:13px;letter-spacing:.04em;background:#2a2336;color:#e8def5;}
.btn:active{transform:translateY(2px);}
.btn.sm{flex:1;}
#fire{flex:1.3;min-height:64px;font-size:18px;font-family:'Dela Gothic One',sans-serif;font-weight:400;background:radial-gradient(circle at 35% 25%,#ff8a7e,#c3132a 60%,#6e0b18);color:#fff;box-shadow:0 5px 0 #4d0710;}
#fire.on{background:radial-gradient(circle at 35% 25%,#9dffb8,#15a14a 60%,#0a5226);box-shadow:0 5px 0 #06341a;}
#push{flex:1;min-height:64px;font-family:'Dela Gothic One',sans-serif;font-weight:400;font-size:17px;background:radial-gradient(circle at 35% 25%,#fff1b8,#9c7a2a 70%);color:#3a2600;opacity:.45;box-shadow:0 5px 0 #4d3a10;}
#push.ready{opacity:1;animation:pz .25s ease-in-out infinite alternate;box-shadow:0 5px 0 #4d3a10,0 0 22px #ffd75e;}
@keyframes pz{to{transform:scale(1.06);}}
details{font-size:12px;color:#b3a9c2;background:#1d1827;border-radius:12px;padding:8px 12px;}
summary{cursor:pointer;font-weight:900;color:var(--accent);}
details ul{margin:6px 0 2px;padding-left:18px;line-height:1.7;}
.foot{margin-top:10px;font-size:11px;color:var(--sub);text-align:center;line-height:1.7;}
@media (prefers-reduced-motion: reduce){#push.ready{animation:none;}}

<body data-machine="raijin">

</div>
<script>
// ===== 盤面ジオメトリ + 物理 =====
const W = 360, H = 600, CX = 180;
const BALL_R = 5, PIN_R = 3;
const RAIL_CY = 190, RAIL_R = 168, RPATH = RAIL_R - BALL_R;
const GRAV = 0.14;
const LCD = { x: 62, y: 96, w: 236, h: 204 };
const HESO = { x: 180, y: 384, r: 8 };
const DENCHU = { x: 326, y: 416, r: 12 };
const ATK = { x: 292, y: 512, hw: 38 };
const SIDES = [{ x: 70, y: 472, r: 8 }, { x: 126, y: 530, r: 8 }];
const WARP = { y1: 190, y2: 216 };

function inCircle(x, y, m) {
  if (y >= RAIL_CY) return x > 12 + m && x < W - 12 - m;
  return Math.hypot(x - CX, y - RAIL_CY) < RAIL_R - m;
}

function buildBoard() {
  const pins = [];
  const add = (x, y, g) => pins.push({ x, y, g: !!g });
  // 天釘
  [[118, 62], [150, 50], [210, 50], [242, 62], [134, 78], [226, 78], [180, 66]].forEach(([x, y]) => add(x, y));
  // 左右の通路
  for (let r = 0; r < 8; r++) {
    const y = 118 + r * 23;
    const xs = r % 2 ? [38] : [27, 47];
    for (const x of xs) {
      if (inCircle(x, y, 12)) add(x, y);
      const mx = W - x;
      if (inCircle(mx, y, 12)) add(mx, y);
    }
  }
  // 道釘(こぼし2カ所)
  const n = 12;
  for (let i = 0; i <= n; i++) {
    if (i === 3 || i === 6 || i === 9) continue;
    add(20 + i * 11, 318 + i * 2.9);
  }
  // ヘソ周り
  add(171, 368, true); add(189, 368, true); // 命釘
  add(146, 374); add(214, 374);
  add(214, 334); add(224, 318);
  // 右ルート
  [[324, 330], [340, 352], [314, 360], [332, 382]].forEach(([x, y]) => add(x, y));
  // 下段フィールド
  for (let r = 0; r < 7; r++) {
    const y = 404 + r * 26;
    const off = r % 2 ? 13 : 0;
    for (let x = 26 + off; x <= 226; x += 26) {
      if (Math.abs(x - HESO.x) < 20 && y < 420) continue;
      let near = false;
      for (const s of SIDES) if (Math.hypot(x - s.x, y - s.y) < 16) near = true;
      if (near) continue;
      if (x > 200 && y > 470) continue;
      add(x, y);
    }
  }
  // セグメント(レール)
  const segs = [
    { x1: 298, y1: 300, x2: 240, y2: 452 },   // 右ルート仕切り
    { x1: 240, y1: 452, x2: 240, y2: 488 },
    { x1: 348, y1: 452, x2: 330, y2: 482 },   // アタッカー誘導
    { x1: 240, y1: 488, x2: 254, y2: 504 },
  ];
  return { pins, segs };
}

function collideSeg(b, s) {
  const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
  const L2 = dx * dx + dy * dy;
  let t = ((b.x - s.x1) * dx + (b.y - s.y1) * dy) / L2;
  t = Math.max(0, Math.min(1, t));
  const px = s.x1 + t * dx, py = s.y1 + t * dy;
  const ex = b.x - px, ey = b.y - py;
  const d = Math.hypot(ex, ey);
  const rr = BALL_R + 2;
  if (d < rr && d > 0.0001) {
    const nx = ex / d, ny = ey / d;
    b.x = px + nx * rr; b.y = py + ny * rr;
    const dot = b.vx * nx + b.vy * ny;
    if (dot < 0) { b.vx -= 1.4 * dot * nx; b.vy -= 1.4 * dot * ny; b.vx *= 0.98; b.vy *= 0.98; }
  }
}

// 1玉を1フレーム進める。戻り値: null=継続, 文字列=イベント
function stepBall(b, board, st, rnd) {
  if (b.rail) {
    const oldY = b.y;
    b.th += b.rv / RPATH;
    const nx = CX - RPATH * Math.cos(b.th);
    const ny = RAIL_CY - RPATH * Math.sin(b.th);
    const v2 = b.rv * b.rv + 2 * GRAV * (ny - oldY);
    b.x = nx; b.y = ny;
    if (v2 <= 0.04) return "foul";
    b.rv = Math.sqrt(v2) - 0.012;
    const s = Math.sin(b.th);
    if ((s > 0 && b.rv * b.rv < GRAV * RPATH * s) || b.th > 2.5) {
      b.rail = false;
      b.vx = Math.sin(b.th) * b.rv;
      b.vy = -Math.cos(b.th) * b.rv;
    }
    return null;
  }
  if (b.stage) {
    b.st++;
    b.x = CX + Math.sin(b.st * 0.075 + b.ph) * (70 - b.st * 0.5);
    b.y = LCD.y + LCD.h - 8;
    if (b.st >= b.dur) {
      b.stage = false;
      if (b.center) { b.x = CX + (rnd() - 0.5) * 6; b.vx = (rnd() - 0.5) * 0.3; }
      else { const side = rnd() < 0.5 ? -1 : 1; b.x = CX + side * (34 + rnd() * 20); b.vx = side * (0.4 + rnd() * 0.6); }
      b.y = LCD.y + LCD.h + BALL_R + 1; b.vy = 0.3;
    }
    return null;
  }
  b.vy += GRAV;
  b.vx *= 0.998; b.vy *= 0.998;
  b.x += b.vx; b.y += b.vy;

  // 外周
  if (b.y < RAIL_CY) {
    const dx = b.x - CX, dy = b.y - RAIL_CY;
    const d = Math.hypot(dx, dy) || 0.01;
    if (d > RAIL_R - BALL_R) {
      const nx = dx / d, ny = dy / d;
      b.x = CX + nx * (RAIL_R - BALL_R); b.y = RAIL_CY + ny * (RAIL_R - BALL_R);
      const dot = b.vx * nx + b.vy * ny;
      if (dot > 0) { b.vx -= 1.45 * dot * nx; b.vy -= 1.45 * dot * ny; }
    }
  }
  if (b.x < 12 + BALL_R) { b.x = 12 + BALL_R; b.vx = Math.abs(b.vx) * 0.45; }
  if (b.x > W - 12 - BALL_R) { b.x = W - 12 - BALL_R; b.vx = -Math.abs(b.vx) * 0.45; }

  // 液晶枠
  const L = LCD.x - BALL_R, R = LCD.x + LCD.w + BALL_R, T = LCD.y - BALL_R, B = LCD.y + LCD.h + BALL_R;
  if (b.x > L && b.x < R && b.y > T && b.y < B) {
    const pl = b.x - L, pr = R - b.x, pt = b.y - T, pb = B - b.y;
    const m = Math.min(pl, pr, pt, pb);
    if (m === pl) {
      if (b.y > WARP.y1 && b.y < WARP.y2) {
        b.stage = true; b.st = 0; b.dur = 80 + Math.floor(rnd() * 50);
        b.ph = rnd() * 6; b.center = rnd() < 0.3; b.vx = 0; b.vy = 0;
        return "warp";
      }
      b.x = L; b.vx = -Math.abs(b.vx) * 0.45;
    } else if (m === pr) { b.x = R; b.vx = Math.abs(b.vx) * 0.45; }
    else if (m === pt) {
      b.y = T; b.vy = -Math.abs(b.vy) * 0.35;
      b.vx += b.x < CX ? -0.3 : 0.3;
    } else { b.y = B; b.vy = Math.abs(b.vy) * 0.45; }
  }

  // 釘
  const rr = BALL_R + PIN_R;
  for (const p of board.pins) {
    const dx = b.x - p.x, dy = b.y - p.y;
    if (dx > rr || dx < -rr || dy > rr || dy < -rr) continue;
    const d2 = dx * dx + dy * dy;
    if (d2 < rr * rr) {
      const d = Math.sqrt(d2) || 0.01;
      const nx = dx / d, ny = dy / d;
      b.x = p.x + nx * rr; b.y = p.y + ny * rr;
      const dot = b.vx * nx + b.vy * ny;
      if (dot < 0) {
        b.vx -= 1.5 * dot * nx; b.vy -= 1.5 * dot * ny;
        b.vx += (rnd() - 0.5) * 0.45;
      }
    }
  }
  for (const s of board.segs) collideSeg(b, s);

  // 入賞
  if (b.vy > 0 && Math.hypot(b.x - HESO.x, b.y - HESO.y) < HESO.r) return "heso";
  if (st.denchuOpen && Math.hypot(b.x - DENCHU.x, b.y - DENCHU.y) < DENCHU.r) return "denchu";
  for (const s of SIDES) if (Math.hypot(b.x - s.x, b.y - s.y) < s.r) return "side";
  if (st.atkOpen && b.vy > 0 && Math.abs(b.y - ATK.y) < 6 && Math.abs(b.x - ATK.x) < ATK.hw) return "atk";
  if (b.y > H - 8) return "out";
  return null;
}

function newBall(power, rnd) {
  const th = 0.02;
  const base = power <= 60 ? 5.0 + power * 0.025 : 6.5 + (power - 60) * 0.07;
  const rv = base + (rnd() - 0.5) * 0.2;
  return { rail: true, th, rv, x: CX - RPATH * Math.cos(th), y: RAIL_CY - RPATH * Math.sin(th), vx: 0, vy: 0 };
}
// ===== 機種定義 =====
const MACHINES = {
  raijin: {
    id: "raijin", title: "P天雷神楽", sub: "天雷RUSH", type: "ST",
    pNormal: 39.9, pRush: 7.9, rushSpins: 12, rushIn: 0.5,
    syms: ["一", "二", "三", "四", "五", "六", "七", "八", "九"],
    rushName: "天雷RUSH", sp: "雷鳴リーチ", spsp: "神楽舞 決戦リーチ",
    missSP: "無念…", frame: ["#f4d27a", "#9a1f1a", "#5a0c0a", "#f4d27a"],
    specLines: [
      "大当たり確率 1/39.9 → RUSH中 1/7.9(デモ用スペック)",
      "初当たりの50%で天雷RUSH突入(奇数図柄=RUSH)",
      "天雷RUSH:ST12回転・継続率約80%・10R",
      "右打ちで電チュー&アタッカーを狙う",
    ],
  },
  abyss: {
    id: "abyss", title: "P深海都市アビス", sub: "V-LOOP", type: "V",
    pNormal: 29.9, pKo: 5, rushSpins: 7,
    syms: ["1", "2", "3", "4", "5", "6", "7", "8", "9", "V"],
    rushName: "V-LOOP", sp: "深淵リーチ", spsp: "リヴァイアサン強襲",
    missSP: "逃げられた…", frame: ["#dff6ff", "#3b6e86", "#0d2433", "#9be8ff"],
    specLines: [
      "1種2種混合タイプ:ヘソ大当たり 1/29.9(デモ用スペック)",
      "当たり後は時短7回のV-LOOPへ",
      "V-LOOP中は電チュー入賞の1/5で小当たり→V入賞で10R",
      "継続率約79%。Vチャンス中は右打ち継続",
    ],
  },
  jin: {
    id: "jin", title: "P荒野拳伝 蒼月", sub: "闘神RUSH", type: "ST",
    pNormal: 49.9, pRush: 9.9, rushSpins: 16, rushIn: 0.55,
    spec2: { demo: { pNormal: 49.9, pRush: 9.9, rushSpins: 16 }, real: { pNormal: 319.7, pRush: 99.9, rushSpins: 130 } },
    syms: ["1", "2", "3", "4", "5", "6", "7", "8", "9"],
    rushName: "闘神RUSH", sp: "BATTLE", spsp: "最終決戦", missSP: "敗北…",
    tierHit: [["normal", 5], ["sp", 40], ["spsp", 55]],

const DT = 1 / 60;

function newGame() {

// ===== 抽選 =====
function decide(src) {
  const rushNow = G.mode === "rush";
  let kind = "miss";
  if (M.type === "ST") {
    const S = curSpec();
    if (rnd() < 1 / (rushNow ? S.pRush : S.pNormal)) kind = "hit";
  } else if (src === "denchu") {
    if (rnd() < 1 / M.pKo) kind = "ko";
  } else if (rnd() < 1 / M.pNormal) kind = "hit";

  const res = { kind, fast: rushNow, rushNext: false, rounds: 3 };
  if (kind === "hit") {
    if (M.type === "ST") { res.rushNext = rushNow || rnd() < M.rushIn; res.rounds = res.rushNext ? 10 : 3; }
    else { res.rushNext = true; res.rounds = rushNow ? 10 : 3; }
  }
  if (kind === "ko") { res.rushNext = true; res.rounds = 10; }

  // リーチ段階
  res.allRot = false;
  if (kind === "hit") {
    if (rnd() < 0.05) { res.allRot = true; res.tier = "all"; }
    else res.tier = pick(rushNow ? [["none", 20], ["normal", 30], ["sp", 35], ["spsp", 15]] : M.tierHit || [["normal", 12], ["sp", 38], ["spsp", 50]]);
  } else if (kind === "ko") res.tier = pick([["none", 60], ["normal", 40]]);
  else res.tier = pick(rushNow ? [["none", 88], ["normal", 9], ["sp", 3]] : M.tierMiss || [["none", 80], ["normal", 14], ["sp", 4.5], ["spsp", 1.5]]);

  // 図柄
  const r9 = () => Math.floor(rnd() * 9);
  let L, C, R;
  if (kind === "hit") {
    if (M.type === "ST") L = res.rushNext ? [0, 2, 4, 6, 8][Math.floor(rnd() * 5)] : [1, 3, 5, 7][Math.floor(rnd() * 4)];
    else L = r9();
    C = L; R = L;
  } else if (kind === "ko") {
    L = r9(); R = res.tier === "none" ? (L + 1 + Math.floor(rnd() * 8)) % 9 : L; C = 9;
  } else if (res.tier === "none") {
    L = r9(); R = (L + 1 + Math.floor(rnd() * 8)) % 9; C = r9();
  } else {
    L = r9(); R = L; C = (L + (rnd() < 0.5 ? 1 : 8)) % 9;
  }
  res.dig = [L, C, R];

  // 先読み保留
  const hitish = kind === "hit";
  if (hitish) res.color = pick([["rainbow", 8], ["red", 40], ["green", 22], ["blue", 15], ["white", 15]]);
  else if (res.tier === "spsp") res.color = pick([["red", 30], ["green", 30], ["blue", 20], ["white", 20]]);
  else if (res.tier === "sp") res.color = pick([["green", 20], ["blue", 25], ["white", 55]]);
  else res.color = rnd() < 0.05 ? "blue" : "white";

  // 予告
  const t = res.tier;
  const reach = t !== "none" && t !== "all";
  res.cut = null;
  if (reach) {
    if (hitish) res.cut = pick([["gold", 10], ["red", 45], ["green", 25], ["blue", 20]]);
    else if (t === "spsp") res.cut = pick([["red", 20], ["green", 40], ["blue", 40]]);
    else if (t === "sp") res.cut = pick([["green", 20], ["blue", 50], [null, 30]]);
    else res.cut = pick([["blue", 30], [null, 70]]);
  }
  res.step = rushNow ? 0 : hitish ? pick([[2, 15], [3, 30], [4, 35], [5, 20]]) : t === "spsp" ? pick([[2, 40], [3, 40], [4, 20]]) : t === "sp" ? pick([[1, 40], [2, 40], [3, 20]]) : (rnd() < 0.15 ? 1 : 0);
  res.gim = (t === "spsp" || t === "sp") && rnd() < (hitish ? 0.55 : 0.12);
  if (M.decorate) M.decorate(res);
  return res;
}

function buildSpin(res) {
  const f = res.fast;
  const s = { ...res, t: 0, seed: [rnd() * 9, rnd() * 9, rnd() * 9], fired: {}, revealed: false, pushed: false };
  s.tL = f ? 0.55 : 1.3;
  s.tR = f ? 0.85 : 1.95;
  if (s.tier === "all") s.tC = 6.2;
  else if (s.tier === "none") s.tC = f ? 1.15 : 2.5;
  else if (s.tier === "normal") s.tC = f ? 3.2 : 5.0;
  else if (s.tier === "sp") s.tC = f ? 7.2 : 9.2;
  else s.tC = 13.2;
  s.spStart = s.tR + 1.2;
  s.pushAt = s.tier === "spsp" ? 11.0 : 99;
  s.hold = s.kind === "hit" ? 2.0 : s.kind === "ko" ? 1.2 : s.tier === "none" ? 0.3 : s.tier === "normal" ? 0.6 : 1.3;

}

// ===== ゲーム進行 =====
function addHold(src) {
  if (G.holds.length >= 4) return;
  const res = decide(src);
  G.holds.push(res);
  SFX.hold(res.qcolor || res.color);
}

function startSpin(res) {
  G.phase = "spin";
  G.spin = buildSpin(res);
  G.fx.cur = res.qcolor || res.color;
  G.stats.spins++;
  G.idleT = 0;
  if (G.mode === "rush") G.rushLeft--;

}

function startBonus(s) {
  const fromRush = G.mode === "rush";
  G.phase = "bonus";
  G.stats.hits++;
  if (!fromRush) { G.stats.first++; G.stats.chain = 1; G.stats.rushGain = 0; }
  else G.stats.chain++;

  G.bonus = { state: "open", t: 0, round: 1, total: s.rounds, count: 0, gained: 0, rushNext: s.rushNext, fromRush, premium: s.dig[0] === 6 && s.kind === "hit" };
  G.spin = null;
  if (M.onBonusStart) M.onBonusStart(G.bonus);

}

function flash(col, a) { G.fx.flashCol = col; G.fx.flash = a; }

function endSpinMiss() {
  G.spin = null;
  G.phase = "idle";
  G.cool = 0.25;
  if (G.mode === "rush" && G.rushLeft <= 0) {
    G.phase = "result";
    G.result = { t: 0, dur: M.resultDur || 3.2, kind: "rushEnd" };

    if (M.onRushEnd) M.onRushEnd();

}

function updateSpin() {
  const s = G.spin;
  s.t += DT;
  const t = s.t;
  const once = (k, fn) => { if (!s.fired[k]) { s.fired[k] = true; fn(); } };
  const reach = s.tier !== "none" && s.tier !== "all";
  for (let k = 1; k <= s.step; k++) if (t >= 0.25 + (k - 1) * 0.32) once("st" + k, () => SFX.step(k));
  if (t >= s.tL) once("L", SFX.stop);
  if (t >= s.tR && s.tier !== "all") once("R", () => { SFX.stop(); if (reach) SFX.reach(); });
  if (s.tier === "all" && t >= s.tL) once("all", () => { SFX.rushIn(); flash("#ffffff", 0.7); });
  if (reach && s.cut && t >= s.tR + 0.35) once("cut", () => SFX.cut(s.cut));
  if (s.gim && t >= s.tR + 0.7) once("gim", () => { SFX.gim(); G.fx.gim = { t: 0 }; G.fx.shake = 18; flash("#ffffff", 0.8); });
  if ((s.tier === "sp" || s.tier === "spsp") && t >= s.tR + 0.9) once("dev", () => tone(660, 0.4, "sawtooth", 0.04, 600));

function updateBonus() {

  if (b.state === "open") { if (b.t > (b.openDur || 2.6)) { b.state = "round"; b.t = 0; SFX.round(); } }
  else if (b.state === "round") { if (b.count >= ATK_COUNT || b.t > 16) { b.state = "gap"; b.t = 0; } }
  else if (b.state === "gap") {
    if (b.t > 0.8) {
      if (b.round >= b.total) {
        b.state = "end"; b.t = 0;
        if (b.rushNext) SFX.rushIn(); else SFX.end();
        if (M.onBonusEnd) M.onBonusEnd(b);
      } else { b.round++; b.count = 0; b.state = "round"; b.t = 0; SFX.round(); }

function updateV() {

  G.atkOpen = !v.got && v.t < 2.2;
  if (v.got && v.t > 1.4) { G.v = null; startBonus({ rounds: 10, rushNext: true, dig: [0], kind: "ko" }); }

}

function onEvent(ev, b) {

}

}

function artRaijin(kind, t, R) {

    ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * (kind === "spsp" ? 0.9 : 0.4));

function artAbyss(kind, t, R) {
  const pal = { base: ["#04304a", "#010b16"], rush: ["#1b1560", "#030418"], sp: ["#03343a", "#000b0e"], spsp: ["#2a0730", "#040008"], bonus: ["#006b80", "#00202a"] }[kind];

    ctx.beginPath(); ctx.moveTo(x - 10, R.y); ctx.lineTo(x + 14, R.y); ctx.lineTo(x + 50, R.y + R.h); ctx.lineTo(x - 4, R.y + R.h); ctx.fill();

      ctx.lineWidth = pass ? 3 : kind === "spsp" ? 26 : 18;

    }

function art(kind, t, R) { if (M.id === "raijin") artRaijin(kind, t, R); else artAbyss(kind, t, R); }

// ---- リール ----
function reelPos(i, s) {
  const t = s.t;
  const target = s.dig[i];
  const stopT = i === 0 ? s.tL : i === 2 ? s.tR : s.tC;
  const bounce = (dt) => Math.sin(dt * 22) * Math.exp(-dt * 9) * 0.12;

    if (t >= s.tC) return target - bounce(t - s.tC);
    return target - (s.tC - t) * 2.5;
  }
  if (t >= stopT || (i === 1 && s.revealed)) return target - bounce(t - Math.min(t, stopT));
  if (i === 1 && s.tier === "normal" && t >= s.tR) {
    const rem = s.tC - t;
    return target - rem * (1.2 + rem * 0.5);
  }
  return s.seed[i] + t * 15;
}

  ctx.beginPath(); ctx.rect(cx - size * 0.6, cy - clipH / 2, size * 1.2, clipH); ctx.clip();

  }
  ctx.restore();
}
function currentDisplay(i) {

}

}

function drawLCD(t) {

function spinOverlays(R, t, s, cx, cy) {

// ---- 役物 ----
function gimK() {
  const gm = G.fx.gim;
  if (!gm) return 0;
  const gt = gm.t;
  if (gt < 0.35) { const u = gt / 0.35; return 1 - Math.pow(1 - u, 3) + Math.sin(u * 9) * 0.06 * (1 - u); }
  if (gt < 1.9) return 1;
  return 1 - clamp((gt - 1.9) / 0.6, 0, 1);
}
function drawGimmick(t) {
  if (M.id === "jin") { drawGimmickJin(t); return; }
  const gm = G.fx.gim;
  let k = 0;
  if (gm) {
    const gt = gm.t;
    if (gt < 0.35) { const u = gt / 0.35; k = 1 - Math.pow(1 - u, 3) + Math.sin(u * 9) * 0.06 * (1 - u); }
    else if (gt < 1.9) k = 1;
    else k = 1 - clamp((gt - 1.9) / 0.6, 0, 1);
  }
  if (M.id === "raijin") {
    const x = CX, y0 = LCD.y - 8, y1 = LCD.y + LCD.h * 0.5;
    const y = y0 + (y1 - y0) * k, r = 30 + 18 * k;
    ctx.save(); ctx.translate(x, y); ctx.rotate(t * (gm ? 3 : 0.4));
    ctx.shadowColor = gm ? "#ffd75e" : "rgba(0,0,0,0)"; ctx.shadowBlur = gm ? 24 : 0;
    ctx.strokeStyle = "#e9c35a"; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
    ctx.shadowBlur = 0;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      ctx.fillStyle = "#8c1712"; ctx.beginPath(); ctx.arc(px, py, 7 + 3 * k, 0, 7); ctx.fill();
      ctx.strokeStyle = "#f2cf6a"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = gm && Math.floor(t * 10 + i) % 2 ? "#fff6c0" : "#f2cf6a";
      ctx.beginPath(); ctx.arc(px, py, 2.5 + k, 0, 7); ctx.fill();
    }
    ctx.restore();
    if (gm && k > 0.9) glowText("雷", x, y + 2, 34, "#fff6d0", "#ffb23d");
  } else {
    const x0 = LCD.x + LCD.w - 20, y0 = LCD.y - 4;
    const x = x0 + (CX - x0) * k, y = y0 + (LCD.y + LCD.h * 0.5 - y0) * k, r = 22 + 26 * k;
    ctx.save(); ctx.translate(x, y);
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, 2, 0, 0, r);
    g.addColorStop(0, "#e9f7ff"); g.addColorStop(1, "#5f8ea3");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
    ctx.fillStyle = gm && k > 0.9 ? "#7ffcff" : "#0b2a3a";
    ctx.shadowColor = "#5ff"; ctx.shadowBlur = gm ? 24 : 0;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.66, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    ctx.rotate(gm ? t * 4 : 0);
    for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2; ctx.fillStyle = "#314e5c"; ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.83, Math.sin(a) * r * 0.83, 2 + k, 0, 7); ctx.fill(); }
    ctx.restore();
    if (gm && k > 0.9) outlineText("OPEN", x, y + 2, 18, "#fff", "#005566", 4);
  }
}

function drawBoard(t) {
  const raijin = M.id !== "abyss";
  const jin = M.id === "jin";
  const g = ctx.createLinearGradient(0, 0, 0, H);
  if (jin) { g.addColorStop(0, "#2e1a0e"); g.addColorStop(1, "#0e0805"); }
  else if (raijin) { g.addColorStop(0, "#2a1030"); g.addColorStop(1, "#120616"); }

  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalAlpha = 0.07; ctx.strokeStyle = raijin ? "#ffcf6a" : "#7fe9ff"; ctx.lineWidth = 1;
  if (jin) { for (let x = -H; x < W; x += 14) { ctx.beginPath(); ctx.moveTo(x, H); ctx.lineTo(x + H, 0); ctx.stroke(); } }
  else if (raijin) { for (let y = 0; y < H; y += 22) for (let x = (y / 22) % 2 ? 11 : 0; x < W; x += 22) { ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI); ctx.stroke(); } }
  else { for (let y = 10; y < H; y += 16) { ctx.beginPath(); for (let x = 0; x <= W; x += 8) ctx.lineTo(x, y + Math.sin(x * 0.05 + y) * 3); ctx.stroke(); } }

  // ワープ入口
  ctx.fillStyle = raijin ? "#ffcf6a" : "#6ffcff";
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 5);
  rrect(LCD.x - 8, WARP.y1 + 2, 6, WARP.y2 - WARP.y1 - 4, 3); ctx.fill();
  ctx.globalAlpha = 1;
  // レール部材
  ctx.strokeStyle = railCol; ctx.lineWidth = 4;
  for (const s of board.segs) { ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke(); }
  // 右打ち表記
  ctx.font = "9px " + FONT_B; ctx.textAlign = "center"; ctx.fillStyle = "rgba(255,255,255,.4)";
  ctx.fillText("右打ち", 324, 300);
  // 釘
  for (const p of board.pins) {
    ctx.fillStyle = p.g ? "#f0cf6d" : "#c9d2e2";
    ctx.beginPath(); ctx.arc(p.x, p.y, PIN_R, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.beginPath(); ctx.arc(p.x - 1, p.y - 1, 1, 0, 7); ctx.fill();
  }
  // 一般入賞
  for (const s of SIDES) {
    ctx.fillStyle = raijin ? "#3a0d1a" : "#06263a"; ctx.beginPath(); ctx.arc(s.x, s.y, 8, 0, 7); ctx.fill();
    ctx.strokeStyle = raijin ? "#c24a4a" : "#3fb8d8"; ctx.lineWidth = 2; ctx.stroke();
  }
  // ヘソ
  const pulse = 0.5 + 0.5 * Math.sin(t * 8);
  ctx.save(); ctx.shadowColor = raijin ? "#ff3b30" : "#2ef0ff"; ctx.shadowBlur = 8 + 8 * pulse;
  ctx.fillStyle = raijin ? "#e0302a" : "#20c8e8"; rrect(HESO.x - 12, HESO.y - 4, 24, 12, 4); ctx.fill(); ctx.restore();
  ctx.fillStyle = "#10040a"; rrect(HESO.x - 7, HESO.y - 3, 14, 6, 3); ctx.fill();
  // 電チュー
  const d = DENCHU;
  ctx.fillStyle = "#1a1a24"; ctx.fillRect(d.x - 8, d.y - 2, 16, 10);
  ctx.strokeStyle = G.denchuOpen ? "#ffd75e" : "#8a8fa8"; ctx.lineWidth = 3;
  const wing = G.denchuOpen ? 0.9 : 0.1;
  ctx.beginPath(); ctx.moveTo(d.x - 8, d.y); ctx.lineTo(d.x - 8 - Math.sin(wing) * 10, d.y - Math.cos(wing) * 10);
  ctx.moveTo(d.x + 8, d.y); ctx.lineTo(d.x + 8 + Math.sin(wing) * 10, d.y - Math.cos(wing) * 10); ctx.stroke();
  // アタッカー
  const a = ATK;
  if (G.atkOpen) {

    ctx.fillStyle = "#ffcf4d"; ctx.fillRect(a.x - a.hw, a.y - 4, a.hw * 2, 12); ctx.restore();
    ctx.fillStyle = "#2a1800"; ctx.fillRect(a.x - a.hw + 4, a.y - 1, a.hw * 2 - 8, 6);
    if (M.type === "V" && G.phase === "v") glowText("V", a.x, a.y + 2, 12, "#ffe07a", "#ff9d1f");
  } else {
    ctx.fillStyle = raijin ? "#6d5320" : "#3b5b6b"; ctx.fillRect(a.x - a.hw, a.y - 2, a.hw * 2, 6);

  // アウト口
  ctx.fillStyle = "#000"; rrect(CX - 22, H - 12, 44, 14, 6); ctx.fill();
}

function drawBalls() {

function render() {

}

// ---------- 背景 ----------
const RUINS = [[0, 40, 26], [30, 62, 20], [56, 34, 30], [92, 70, 18], [118, 48, 24], [150, 82, 16], [172, 44, 28], [206, 60, 22], [230, 38, 20]];

  const P = {
    base: ["#3a140a", "#b4521c", "#2e1a0c"], zone: ["#3a0000", "#8a0a0a", "#1a0404"], rush: ["#1a0306", "#5a0a14", "#12040a"],
    battle: ["#1e1210", "#5a2a16", "#140a06"], story: ["#0c0414", "#3a0c2a", "#08030a"], bonus: ["#5a3200", "#e0a030", "#2a1400"],

  g.addColorStop(0, P[0]); g.addColorStop(0.62, P[1]); g.addColorStop(0.63, P[2]); g.addColorStop(1, "#050302");

  if (kind === "story" || kind === "rush") { ctx.save(); ctx.shadowColor = "#ff3040"; ctx.shadowBlur = 30; ctx.fillStyle = kind === "story" ? "#c01a2a" : "#7a0a18"; ctx.beginPath(); ctx.arc(R.x + R.w * 0.72, R.y + 50, 26, 0, 7); ctx.fill(); ctx.restore(); }
  if (kind === "rush") glowText("闘", R.x + R.w / 2, R.y + R.h * 0.45, 130, "rgba(255,40,60,.1)", "rgba(255,40,60,.2)");
  if (kind === "bonus") { ctx.save(); ctx.translate(R.x + R.w / 2, R.y + R.h / 2); ctx.rotate(t * 0.5); for (let i = 0; i < 12; i++) { ctx.rotate(Math.PI / 6); ctx.fillStyle = "rgba(255,230,140,.13)"; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(260, -40); ctx.lineTo(260, 40); ctx.fill(); } ctx.restore(); }

// ---------- 図柄 ----------
function drawSymJin(idx, cx, cy, s, t) {
  const w = s * 0.86, h = s * 0.92;
  let top, bot, tx = M.syms[idx], txt = "#fff", stroke = "#000";
  if (idx === "KEN") { top = "#ffe89a"; bot = "#9a6a10"; tx = "拳"; txt = "#6a0000"; stroke = "#fff4c8"; }
  else if (idx === "NEXT") { top = "#6af"; bot = "#123a8a"; tx = "NEXT"; }
  else if (idx === 6) { top = "#fff0a0"; bot = "#b8820f"; txt = "#b00000"; stroke = "#fff"; }
  else if (idx % 2 === 0) { top = "#d63a30"; bot = "#4a0806"; }
  else { top = "#c8ccd6"; bot = "#3a3e48"; }
  const g = ctx.createLinearGradient(0, cy - h / 2, 0, cy + h / 2);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  ctx.fillStyle = g; rrect(cx - w / 2, cy - h / 2, w, h, s * 0.12); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.7)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = 1; rrect(cx - w / 2 + 3, cy - h / 2 + 3, w - 6, h - 6, s * 0.09); ctx.stroke();
  ctx.save(); ctx.font = Math.floor(tx.length > 1 ? s * 0.26 : s * 0.66) + "px " + FONT_D; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineJoin = "round"; ctx.lineWidth = s * 0.08; ctx.strokeStyle = stroke; ctx.strokeText(tx, cx, cy + s * 0.04);
  ctx.fillStyle = txt; ctx.fillText(tx, cx, cy + s * 0.04); ctx.restore();

// ---------- 液晶 ----------
function drawLCDJin(t) {
  const R = LCD, s = G.spin, ph = G.phase;
  const cx = R.x + R.w / 2, cy = R.y + R.h * 0.47;
  ctx.save(); ctx.beginPath(); rrect(R.x, R.y, R.w, R.h, 6); ctx.clip();
  const inSP = s && (s.tier === "sp" || s.tier === "spsp") && s.t >= s.spStart;
  if (G.movie) drawMovie(R, t, G.movie);
  else if (ph === "bonus") { artJin("bonus", t, R); drawBonusJin(R, t); }
  else if (ph === "result") { artJin("base", t, R); drawResult(R, t); }
  else if (inSP) drawBattle(R, t, s);
  else {
    let kind = G.mode === "rush" ? "rush" : "base";
    if (s && s.zone) kind = "zone";
    if (s && s.tier === "all" && s.t >= s.tL) kind = "bonus";
    artJin(kind, t, R);
    if (G.mode === "rush") drawChar("zex", R.x + R.w - 40, R.y + R.h - 14, 0.7, { alpha: 0.25, flip: true });
    if (s && s.zone) outlineText("荒天ゾーン", R.x + 40, R.y + 30, 11, "#ffb0a0", "#5a0000", 3);
    drawReelsJin(R, t, s, cx, cy);
    if (s) overlaysJin(R, t, s, cx, cy);
    if (!s && G.idleT > 18 && !G.holds.length) drawDemo(R, t);
  }
  if (ph !== "bonus" && ph !== "result" && !G.movie) drawHolds(R, t);
  if (s && s.chg && s.t > 0.3 && s.t < 1.1) { burst(R.x + 20, R.y + R.h - 26, 16, "rgba(255,230,120,.8)"); outlineText("保留変化!", R.x + 50, R.y + R.h - 46, 12, "#ffe06a", "#8a0000", 3); }
  lcdTail(R, t);
  ctx.restore();
}

function drawReelsJin(R, t, s, cx, cy) {
  const size = G.mode === "rush" ? 56 : 62;
  const xs = [cx - 72, cx, cx + 72];
  if (s && s.off > 0 && s.t < s.off) {
    const seg = Math.floor(s.t / GIJI_SEG), lt = s.t - seg * GIJI_SEG;
    if (lt < 1.0) { for (let i = 0; i < 3; i++) drawReelAt(s.seed[i] + s.t * 15, xs[i], cy, size, size * 1.12); }
    else {
      const b = Math.sin((lt - 1) * 22) * Math.exp(-(lt - 1) * 8) * 6;
      drawSymJin("KEN", xs[0], cy + b, size, t); drawSymJin("NEXT", xs[1], cy + b, size, t); drawSymJin("KEN", xs[2], cy + b, size, t);
      const z = 1 + Math.max(0, 0.25 - (lt - 1)) * 3;
      burst(cx, cy - 50, 30 * z, "rgba(255,210,60,.9)");
      outlineText("擬似連 ×" + (seg + 2), cx, cy - 50, 18 * z, "#fff", "#8a0000", 5);
    }
    return;
  }
  for (let i = 0; i < 3; i++) {
    const p = s ? reelPos(i, s) : G.lastDig ? G.lastDig[i] : [6, 2, 6][i];
    const hot = s && s.tier === "normal" && i === 1 && s.t >= s.tR && !s.revealed;
    if (hot) { ctx.save(); ctx.shadowColor = "#ff2e2e"; ctx.shadowBlur = 20; ctx.strokeStyle = "rgba(255,60,60,.9)"; ctx.lineWidth = 2; rrect(xs[i] - 36, cy - 40, 72, 80, 8); ctx.stroke(); ctx.restore(); }
    drawReelAt(p, xs[i], cy, size, size * 1.12);
  }
}

function overlaysJin(R, t, s, cx, cy) {
  const st = s.t;
  // ステップアップ(キャラ窓)
  if (s.step > 0 && st >= 0.25 && st < 0.25 + s.step * 0.32 + 0.4) {
    const k = Math.min(s.step, Math.floor((st - 0.25) / 0.32) + 1);
    const col = ["#8fa3ff", "#45e08f", "#ff3a4e", "#ffd23d", rainbow(t)][k - 1];
    ctx.fillStyle = "rgba(0,0,0,.7)"; rrect(R.x + 8, cy - 6, 84, 70, 8); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2.5; rrect(R.x + 8, cy - 6, 84, 70, 8); ctx.stroke();
    ctx.save(); ctx.beginPath(); rrect(R.x + 8, cy - 6, 84, 70, 8); ctx.clip();
    drawChar(STEP_CHARS[k - 1], R.x + 50, cy + 74, 0.62, { glow: k >= 4 }); ctx.restore();
    outlineText("STEP" + k, R.x + 50, cy + 56, 12, col, "#000", 3);
  }
  // 群予告
  if (s.mure && st >= 0.6 && st < 2.0) {
    const u = (st - 0.6) / 1.4;
    ctx.fillStyle = "rgba(60,0,0,.35)"; ctx.fillRect(R.x, R.y, R.w, R.h);
    for (let i = 0; i < 9; i++) {
      const x = R.x + R.w + 30 - u * (R.w + 160) + i * 22 + (i % 3) * 6, y = cy + 40 - (i % 3) * 16;
      ctx.fillStyle = "#0a0402";
      ctx.beginPath(); ctx.arc(x - 9, y + 6, 6, 0, 7); ctx.arc(x + 11, y + 6, 6, 0, 7); ctx.fill();
      ctx.fillRect(x - 10, y - 4, 22, 8); ctx.beginPath(); ctx.arc(x + 2, y - 10, 5, 0, 7); ctx.fill();
      ctx.fillStyle = "#e02a2a"; ctx.fillRect(x, y - 18, 3, 6);
    }
    outlineText("暴走団 襲来!!", cx, cy - 56, 22, "#ff5a3a", "#000", 6);
  }
  // セリフ予告

function drawBattle(R, t, s) {
  const u = s.t - s.spStart, story = s.tier === "spsp";

    subtitle(R, u < 1.3 ? "荒野を統べる冥皇、ゼクス——" : "全ての因縁に、決着を。", u < 1.3 ? u : u - 1.3, 14);
    outlineText("最終決戦", cx, R.y + 40, 20, "#ffe06a", "#4a0008", 5);

  const lim = (story ? s.pushAt : s.tC) - s.spStart - 1.6;

  for (let e = 0; e <= ex; e++) { const at = s.intro + e * 1.3 + 0.35; if (Math.min(u, lim) >= at) { if (e % 2 === 0) nJ++; else nE++; } }
  let hpE = Math.max(0.2, 1 - nJ * 0.14), hpJ = Math.max(0.2, 1 - nE * 0.12);
  const rt = s.revealed ? s.t - s.revealT : -1;
  const win = s.kind === "hit" && (!s.revive || rt > 2.2);
  const lost = s.revealed && !win && !(s.revive && rt > 1.2);
  if (s.revealed && win) hpE = Math.max(0, hpE - rt * 2);
  if (lost) hpJ = Math.max(0, hpJ - rt * 2);
  // キャラ配置
  let jo = {}, eo = { flip: true };
  if (u > s.intro && !s.revealed && u < lim + s.intro * 0) {

      if (e % 2 === 0) { jo = { dx: lunge * 50, fist: lunge }; if (local > 0.35 && local < 0.6) eo.dx = Math.sin(local * 80) * 4; }
      else { eo = { flip: true, dx: -lunge * 50, fist: lunge }; if (local > 0.35 && local < 0.6) jo.dx = Math.sin(local * 80) * 4; }

  if (lost) { eo = { flip: true, dx: -40, fist: 1 }; jo = { dx: -rt * 30, dy: rt * 25, rot: -rt * 0.3, alpha: Math.max(0.3, 1 - rt / 1.4) }; }

  const charging = !s.revealed && u >= lim;
  if (charging) { jo.aura = "rgba(120,200,255,.55)"; jo.glow = true; eo.aura = story ? "rgba(170,60,255,.6)" : "rgba(255,80,40,.5)"; }
  if (u > s.intro && !s.revealed) speedLines(R, cx, R.y + R.h * 0.5, "rgba(255,255,255,.07)");
  drawChar("jin", R.x + 62 - (1 - introK) * 100 + (jo.dx || 0), gy, 0.8, Object.assign({}, jo, { dx: 0 }));

}
function stateText() {
  if (G.phase === "bonus") return "大当たり中 " + G.bonus.round + "/" + G.bonus.total + "R";
  if (G.phase === "v") return "Vチャンス";
  if (G.mode === "rush") return M.rushName + " 残" + Math.max(0, G.rushLeft);
  return "通常";
}
let uiTick = 0;
function updateUI() {
  $("credits").textContent = G.credits;
  $("spins").textContent = G.stats.spins;
  $("hits").textContent = G.stats.first + " / " + G.stats.hits;
  $("state").textContent = stateText();
  $("state").classList.toggle("hot", G.mode === "rush" || G.phase === "bonus" || G.phase === "v");
  $("push").classList.toggle("ready", G.pushReady);
  $("pwv").textContent = G.power >= 80 ? "右打ち" : G.power <= 60 ? "左打ち" : "中間";
}
let last = 0, acc = 0;
function loop(ts) {
  if (!last) last = ts;
  acc += Math.min(0.1, (ts - last) / 1000); last = ts;
  let n = 0;
  while (acc >= DT && n < 4) { tick(); acc -= DT; n++; }
  if (n === 4) acc = 0;
  render();
  if (++uiTick % 6 === 0) updateUI();
  requestAnimationFrame(loop);
}
function init() {
  canvas = $("board"); ctx = canvas.getContext("2d");
  setMachine("raijin");
  resize();
  window.addEventListener("resize", resize);
  document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => { audio(); setMachine(b.dataset.id); }));
  $("power").addEventListener("input", (e) => { G.power = Number(e.target.value); });
  $("left").addEventListener("click", () => { $("power").value = 30; G.power = 30; });
  $("right").addEventListener("click", () => { $("power").value = 95; G.power = 95; });
  $("fire").addEventListener("click", () => {
    audio();
    G.firing = !G.firing;
    $("fire").classList.toggle("on", G.firing);
    $("fire").textContent = G.firing ? "停止" : "発射";
  });
  $("push").addEventListener("click", () => {
    audio();
    if (G.pushReady && G.spin) { G.spin.pushed = true; G.pushReady = false; tone(2093, 0.15, "square", 0.06); flash("#ffffff", 0.9); }
  });
  $("real").addEventListener("click", () => { realMode = !realMode; setMachine(M.id); });
  $("lend").addEventListener("click", () => { audio(); G.credits += 500; SFX.lend(); });
  $("mute").addEventListener("click", () => { muted = !muted; $("mute").textContent = muted ? "音 OFF" : "音 ON"; audio(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
  requestAnimationFrame(loop);
}
init();
</script>
