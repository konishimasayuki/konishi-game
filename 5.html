<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>水魂 SUIKON — 3Dボートレース試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f4f7fb; --muted:#a9bccf; --panel:rgba(6,22,40,.86); --panel-line:rgba(255,255,255,.14);
  --signal:#ffd400; --danger:#ff4d4d; --ok:#35e08a; --deep:#06182b;
  --jp:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;
  --num:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#f4f7fb; --muted:#a9bccf; --panel:rgba(4,14,28,.9); --panel-line:rgba(255,255,255,.14); --deep:#040f1d; }
}
:root[data-theme="dark"]{ --ink:#f4f7fb; --muted:#a9bccf; --panel:rgba(4,14,28,.9); --panel-line:rgba(255,255,255,.14); --deep:#040f1d; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:var(--deep);color:var(--ink);font-family:var(--jp);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#c{position:fixed;top:0;left:0;width:100%;height:100%;display:block}
.hud{position:fixed;pointer-events:none;z-index:5}
#topl{top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;display:flex;gap:10px;align-items:flex-end}
#pos{font-family:var(--num);font-style:italic;font-weight:800;font-size:64px;line-height:.8;color:var(--signal);text-shadow:0 3px 0 rgba(0,0,0,.45)}
#pos small{font-family:var(--jp);font-style:normal;font-size:20px;font-weight:900;margin-left:2px}
#lapbox{font-family:var(--num);font-style:italic;font-weight:600;font-size:18px;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.5)}
#lapbox b{font-weight:800;font-size:24px}
#rank{top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;display:flex;flex-direction:column;gap:3px}
.rk{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--panel-line);border-radius:4px;padding:2px 8px 2px 2px;font-size:12px;font-weight:700;min-width:92px;transition:transform .25s}
.rk .ln{width:22px;height:22px;border-radius:3px;display:grid;place-items:center;font-family:var(--num);font-style:italic;font-weight:800;font-size:17px}
.rk.me{outline:2px solid var(--signal)}
.rk .nm{flex:1;white-space:nowrap}
#camBtn{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 184px);right:10px;pointer-events:auto}
#map{top:calc(env(safe-area-inset-top,0px) + 76px);left:10px;width:150px;height:62px;background:var(--panel);border:1px solid var(--panel-line);border-radius:6px}
#msg{top:32%;left:0;right:0;text-align:center;font-weight:900;font-size:44px;letter-spacing:.04em;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(0,0,0,.4);opacity:0;transition:opacity .25s}
#msg.show{opacity:1}
#msg .sub{display:block;font-size:18px;font-weight:700;color:var(--signal);margin-top:6px}
#startUI{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 128px);width:min(86vw,360px);display:none}
#clockTxt{text-align:center;font-family:var(--num);font-style:italic;font-weight:800;font-size:40px;color:var(--signal);text-shadow:0 3px 0 rgba(0,0,0,.4);line-height:1}
#stbar{position:relative;height:18px;margin-top:6px;border-radius:9px;overflow:hidden;background:rgba(0,0,0,.45);border:1px solid var(--panel-line)}
#stbar .z{position:absolute;top:0;bottom:0}
#stmark{position:absolute;top:-3px;width:4px;height:24px;background:#fff;border-radius:2px;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
#stlab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px;font-weight:700}
#controls{position:fixed;z-index:6;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px;pointer-events:none}
.pad{pointer-events:auto;width:92px;height:92px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(6,22,40,.55);color:#fff;font-size:30px;display:grid;place-items:center;touch-action:none;font-family:var(--jp);font-weight:900}
.pad span{display:block;font-size:11px;font-weight:700;margin-top:-18px;color:var(--muted)}
.pad.on{background:rgba(255,212,0,.35);border-color:var(--signal)}
#goBtn{pointer-events:auto;width:128px;height:64px;border-radius:32px;border:0;background:var(--signal);color:#1a1400;font-family:var(--jp);font-weight:900;font-size:22px;display:none;box-shadow:0 5px 0 #a88a00}
#goBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #a88a00}
.btn{font-family:var(--jp);font-weight:700;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--panel-line);border-radius:6px;padding:8px 10px;cursor:pointer}
.btn:focus-visible,.pad:focus-visible,#goBtn:focus-visible,.lane:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(180deg,rgba(3,12,24,.2),rgba(3,12,24,.75));overflow-y:auto;touch-action:pan-y}
.card{width:min(94vw,420px);background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:20px 18px 18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);max-height:100%;overflow-y:auto}
.logo{font-weight:900;font-size:46px;line-height:1;letter-spacing:.02em;display:flex;align-items:baseline;gap:10px}
.logo i{font-family:var(--num);font-weight:800;font-size:26px;color:var(--signal);letter-spacing:.08em}
.tag{color:var(--muted);font-size:13px;margin:6px 0 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.stats div{background:rgba(255,255,255,.06);border-radius:6px;padding:7px 6px;text-align:center}
.stats b{display:block;font-family:var(--num);font-style:italic;font-weight:800;font-size:24px;color:var(--signal);line-height:1}
.stats span{font-size:11px;color:var(--muted)}
h3{font-size:14px;font-weight:700;margin:12px 0 7px;display:flex;justify-content:space-between}
h3 em{font-style:normal;font-family:var(--num);font-weight:800;font-size:18px;color:var(--signal)}
.lanes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.lane{height:44px;border-radius:6px;border:2px solid transparent;font-family:var(--num);font-style:italic;font-weight:800;font-size:24px;cursor:pointer}
.lane.sel{border-color:var(--signal);transform:translateY(-2px)}
input[type=range]{width:100%;accent-color:var(--signal);height:28px}
.bars{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:center;font-size:12px;color:var(--muted);margin-top:4px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:var(--signal);transition:width .2s}
.primary{width:100%;margin-top:16px;height:54px;border:0;border-radius:10px;background:var(--signal);color:#1a1400;font-family:var(--jp);font-weight:900;font-size:19px;cursor:pointer;box-shadow:0 4px 0 #a88a00}
.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #a88a00}
.howto{font-size:12px;color:var(--muted);line-height:1.7;margin-top:12px}
.res{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.res td{padding:6px 4px;border-bottom:1px solid var(--panel-line)}
.res .chip{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:3px;font-family:var(--num);font-style:italic;font-weight:800;font-size:17px}
.res .me td{color:var(--signal);font-weight:700}
.kim{font-weight:900;font-size:30px;margin:4px 0 2px}
.kim small{font-size:14px;color:var(--muted);font-weight:700;margin-left:8px}
.earn{display:flex;gap:8px;margin-top:10px}
.earn div{flex:1;background:rgba(255,255,255,.06);border-radius:6px;padding:8px;text-align:center;font-size:11px;color:var(--muted)}
.earn b{display:block;font-family:var(--num);font-style:italic;font-weight:800;font-size:22px;color:var(--ink)}
.hidden{display:none!important}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:var(--deep);font-weight:700;color:var(--muted)}
@media (prefers-reduced-motion: reduce){ .rk,#msg{transition:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">水面を準備中…</div>

<div class="hud" id="topl"><div id="pos">-</div><div id="lapbox"><b id="lap">1/3</b> 周<br><span id="rtime">0.00</span></div></div>
<div class="hud" id="rank"></div>
<button id="camBtn" class="btn" aria-label="カメラ切替">カメラ: 追従</button>
<canvas class="hud" id="map" width="300" height="124"></canvas>
<div class="hud" id="msg"></div>
<div class="hud" id="startUI">
  <div id="clockTxt">-9.0</div>
  <div id="stbar">
    <div class="z" style="left:0;width:40%;background:rgba(255,77,77,.55)"></div>
    <div class="z" style="left:40%;width:15%;background:rgba(53,224,138,.75)"></div>
    <div class="z" style="left:55%;width:20%;background:rgba(255,212,0,.5)"></div>
    <div id="stmark" style="left:0"></div>
  </div>
  <div id="stlab"><span>フライング</span><span>今出たらST</span><span>遅れ</span></div>
</div>
<div id="controls">
  <button class="pad" id="leftBtn" aria-label="内へ">◀<span>内へ</span></button>
  <button id="goBtn">全速!</button>
  <button class="pad" id="rightBtn" aria-label="外へ">▶<span>外へ</span></button>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <div class="logo">水魂<i>SUIKON</i></div>
    <div class="tag">フル3Dボートレース育成 — 試作デモ</div>
    <div class="stats">
      <div><b id="sGrade">B2</b><span>級別</span></div>
      <div><b id="sRate">0.00</b><span>勝率</span></div>
      <div><b id="sWins">0</b><span>1着</span></div>
      <div><b id="sPrize">0</b><span>賞金(万)</span></div>
    </div>
    <h3>枠番を選ぶ</h3>
    <div class="lanes" id="laneSel"></div>
    <h3>チルト角 <em id="tiltV">0.0°</em></h3>
    <input type="range" id="tilt" min="-0.5" max="3" step="0.5" value="0" aria-label="チルト角">
    <div class="bars">
      <span>出足</span><div class="bar"><i id="bAcc"></i></div>
      <span>伸び</span><div class="bar"><i id="bTop"></i></div>
      <span>回り足</span><div class="bar"><i id="bTurn"></i></div>
    </div>
    <button class="primary" id="startRace">出走する</button>
    <div class="howto">大時計の針が0を指す瞬間にスタートラインを通過。下のバーが緑のうちに「全速!」。レース中は ◀▶ でコース取り、ターン中は外へ流れるので ◀ で内を締めよう。キーボードは ← → と Space、C でカメラ切替。</div>
  </div>
</div>

<div class="overlay hidden" id="result">
  <div class="card">
    <div style="color:var(--muted);font-size:13px;font-weight:700">レース結果</div>
    <div class="kim" id="kimarite">逃げ</div>
    <table class="res" id="resTable"></table>
    <div class="earn">
      <div><b id="eRank">-</b>あなたの着順</div>
      <div><b id="eST">-</b>ST</div>
      <div><b id="ePrize">-</b>獲得賞金(万)</div>
    </div>
    <button class="primary" id="again">次のレースへ</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);

const LANE_HEX=[0xf4f4f4,0x1e1f22,0xe0312c,0x1f5fd6,0xf2c919,0x1e9b4a];
const LANE_CSS=['#f4f4f4','#1e1f22','#e0312c','#1f5fd6','#f2c919','#1e9b4a'];
const LANE_INK=['#111','#fff','#fff','#fff','#111','#fff'];
const NAMES=['峰 竜也','石野 貴','桐生 順','白井 英','毒島 誠','池田 浩','瓜生 正','茅原 悠'];
const L=150,R=10,TURN_LEN=Math.PI*R,P=2*L+2*TURN_LEN,LAPS=3,TOTAL=P*LAPS;
const LANE_D=[0.8,3.5,6.2,8.9,11.6,14.3];
const IDLE=4;

let save={races:0,points:0,prize:0,wins:0};
try{const raw=localStorage.getItem('suikon_v1'); if(raw) Object.assign(save,JSON.parse(raw));}catch(e){}
function persist(){try{localStorage.setItem('suikon_v1',JSON.stringify(save));}catch(e){}}
function rate(){return save.races?save.points/save.races:0;}
function grade(){if(save.races<3)return 'B2';const r=rate();if(r>=6.5)return 'A1';if(r>=5.2)return 'A2';if(r>=3.8)return 'B1';return 'B2';}

const col=h=>new THREE.Color(h).convertSRGBToLinear();

const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,1,0.3,5000);

const SUN=new THREE.Vector3(0.35,0.42,-0.84).normalize();
const HORIZON=col(0xcfe3f2), ZENITH=col(0x2f78c4);
scene.fog=new THREE.Fog(HORIZON,260,1700);

scene.add(new THREE.HemisphereLight(0xcfe8ff,0x33505e,0.75));
const sunL=new THREE.DirectionalLight(0xfff0dc,2.1); sunL.position.copy(SUN).multiplyScalar(100); scene.add(sunL);

const FOG_CHUNK=`uniform vec3 uFog;uniform float uFogNear;uniform float uFogFar;`;
const sky=new THREE.Mesh(new THREE.SphereGeometry(2500,32,20),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{uZ:{value:ZENITH},uH:{value:HORIZON},uSun:{value:SUN},uT:{value:0}},
  vertexShader:`varying vec3 vD;void main(){vD=(modelMatrix*vec4(position,0.0)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`uniform vec3 uZ,uH,uSun;uniform float uT;varying vec3 vD;
  float hs(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float ns(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hs(i),hs(i+vec2(1,0)),f.x),mix(hs(i+vec2(0,1)),hs(i+vec2(1,1)),f.x),f.y);}
  float fbm(vec2 p){float v=0.0,a=0.5;for(int i=0;i<5;i++){v+=a*ns(p);p*=2.03;a*=0.5;}return v;}
  void main(){vec3 d=normalize(vD);float h=d.y;
    vec3 c=mix(uH,uZ,pow(clamp(h,0.0,1.0),0.5));
    if(h>0.0){vec2 uv=d.xz/(h+0.12)*1.3+vec2(uT*0.006,0.0);float cl=smoothstep(0.52,0.82,fbm(uv));
      c=mix(c,vec3(1.0,0.99,0.97)*(0.78+0.3*h),cl*0.85*smoothstep(0.0,0.18,h));}
    float s=max(dot(d,uSun),0.0);
    c+=vec3(1.0,0.9,0.72)*(pow(s,1200.0)*30.0+pow(s,40.0)*0.35+pow(s,5.0)*0.1);
    gl_FragColor=vec4(c,1.0);
    #include <tonemapping_fragment>
    #include <encodings_fragment>
  }`
}));
scene.add(sky);

const boatU=[];for(let i=0;i<6;i++)boatU.push(new THREE.Vector4(0,0,0,0));
function waterMat(withBoats){
  return new THREE.ShaderMaterial({
    fog:false,
    uniforms:{uT:{value:0},uSun:{value:SUN},uZ:{value:ZENITH},uH:{value:HORIZON},uFog:{value:HORIZON},uFogNear:{value:260},uFogFar:{value:1700},
      uDeep:{value:col(0x0a3553)},uShal:{value:col(0x1f7a8f)},uBoats:{value:boatU},uUse:{value:withBoats?1.0:0.0}},
    vertexShader:`uniform float uT;varying vec3 vW;varying vec3 vN;
    float H(vec2 p){return sin(dot(p,vec2(0.34,0.12))+uT*1.3)*0.10+sin(dot(p,vec2(-0.18,0.52))+uT*1.7)*0.06+sin(dot(p,vec2(0.71,-0.44))+uT*2.6)*0.03;}
    void main(){vec4 w=modelMatrix*vec4(position,1.0);float e=0.5;float h=H(w.xz);float hx=H(w.xz+vec2(e,0.0));float hz=H(w.xz+vec2(0.0,e));
      w.y+=h;vN=normalize(vec3(h-hx,e,h-hz));vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
    fragmentShader:`uniform float uT,uUse,uFogNear,uFogFar;uniform vec3 uSun,uZ,uH,uFog,uDeep,uShal;uniform vec4 uBoats[6];
    varying vec3 vW;varying vec3 vN;
    float hs(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
    float ns(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hs(i),hs(i+vec2(1,0)),f.x),mix(hs(i+vec2(0,1)),hs(i+vec2(1,1)),f.x),f.y);}
    void main(){
      vec2 p=vW.xz;vec3 n=normalize(vN);
      float r1=sin(p.x*1.7+uT*2.1)*cos(p.y*1.3-uT*1.7);float r2=sin(p.x*3.1-p.y*2.3+uT*3.3);float r3=sin(p.x*0.9+p.y*4.3-uT*2.4);
      n=normalize(n+vec3(r1*0.05+r2*0.025+r3*0.015,0.0,r2*0.035-r1*0.02+r3*0.02));
      float foam=0.0;
      if(uUse>0.5){
        for(int i=0;i<6;i++){vec4 b=uBoats[i];if(b.z<0.02)continue;
          vec2 f=vec2(sin(b.w),cos(b.w));vec2 rel=p-b.xy;float al=dot(rel,-f);float sd=dot(rel,vec2(f.y,-f.x));
          if(al>-2.6&&al<70.0){float a=max(al,0.0);float sp=b.z;
            float ed=abs(abs(sd)-(1.0+a*0.34));float w=0.35+a*0.06;
            float v=exp(-ed*ed/(w*w))*exp(-a*0.04)*sp;
            float c=exp(-sd*sd/(0.7+a*0.12))*exp(-a*0.06)*sp;
            float hull=exp(-(sd*sd)/1.4)*smoothstep(-2.6,-1.6,al)*(1.0-smoothstep(-0.5,1.0,al))*sp;
            foam+=v*0.95+c*(0.9-0.4*step(a,0.1))+hull*0.8;
            n.xz+=vec2(sd,al)*0.0+vec2(sin(a*1.4-uT*7.0),cos(sd*2.0))*0.06*(v+c);
          }}
      }
      n=normalize(n);
      vec3 V=normalize(cameraPosition-vW);
      float fr=0.03+0.97*pow(1.0-max(dot(n,V),0.0),5.0);
      vec3 Rv=reflect(-V,n);Rv.y=abs(Rv.y);
      vec3 sk=mix(uH,uZ,pow(clamp(Rv.y,0.0,1.0),0.5));
      vec3 wc=mix(uDeep,uShal,clamp(0.35+0.5*(1.0-n.y)*8.0,0.0,1.0));
      float sd2=max(dot(Rv,uSun),0.0);
      float spec=pow(sd2,600.0)*9.0+pow(sd2,60.0)*0.5;
      vec3 c=mix(wc,sk,fr*0.9)+spec*vec3(1.0,0.93,0.8);
      float br=ns(p*3.0+vec2(uT*0.6,0.0))*0.6+ns(p*7.0-uT*0.8)*0.4;
      float fm=clamp(foam*(0.55+0.7*br),0.0,1.0);
      c=mix(c,vec3(0.93,0.97,1.0),fm);
      float dist=length(cameraPosition-vW);c=mix(c,uFog,smoothstep(uFogNear,uFogFar,dist));
      gl_FragColor=vec4(c,1.0);
      #include <tonemapping_fragment>
      #include <encodings_fragment>
    }`

function buildRank(){const r=$('rank');r.innerHTML='';boats.forEach(b=>{const e=document.createElement('div');e.className='rk'+(b.isP?' me':'');e.id='rk'+b.i;
  e.innerHTML=`<span class="ln" style="background:${LANE_CSS[b.i]};color:${LANE_INK[b.i]}">${b.i+1}</span><span class="nm">${b.name}</span>`;r.appendChild(e);});}
function order(){return boats.slice().sort((a,b)=>{if(a.F!==b.F)return a.F?1:-1;if(a.fin&&b.fin)return a.finT-b.finT;if(a.fin!==b.fin)return a.fin?-1:1;return b.s-a.s;});}

function planFor(b){
  let aheadMinD=null,near=[];
  for(const o of boats){if(o===b||o.F||o.fin)continue;const gap=o.s-b.s;if(gap>-6&&gap<14){near.push(o);if(gap>1.5&&(aheadMinD===null||o.d<aheadMinD))aheadMinD=o.d;}}
  if(aheadMinD===null)return 0.8;
  const leadNear=near.filter(o=>o.s>b.s+1.5);
  if(b.style>0.55&&b.d>aheadMinD){const maxD=Math.max(...near.map(o=>o.d));return Math.min(16,maxD+2.8);}
  return Math.min(16,aheadMinD+2.7+Math.random()*0.8);
}

function step(dt){
  T+=dt;
  for(const b of boats){
    const prevS=b.s;
    if(state==='prestart'&&!b.go){
      if(!b.isP){const pred=T+ttc(-b.s,b.v,b.acc,b.top);if(pred>=b.stT)b.go=true;}
      else if(T>0.6){b.go=true;}
    }
    let target=b.go?b.top:IDLE;
    const tp=trackPos(b.s,b.d);const inTurn=tp.turn>0&&b.s>=0;
    if(inTurn)target=b.top*Math.min(1.0,0.66+0.03*b.d)*b.turn;
    if(b.wake)target*=0.93;
    if(b.F)target=13;
    if(b.fin)target=14;
    if(b.v<target)b.v=Math.min(target,b.v+b.acc*dt*(1-0.45*b.v/b.top));else b.v=Math.max(target,b.v-(b.go?20:3)*dt);
    const rateF=inTurn?R/(R+b.d):1;
    b.s+=b.v*rateF*dt;
    if(b.st===null&&prevS<0&&b.s>=0){const st=T-dt+(0-prevS)/(b.s-prevS)*dt;b.st=st;
      if(st<0){b.F=true;b.dT=17;if(b.isP)showMsg('フライング','返還欠場 — 次で取り返そう',2.5);}
      else if(b.isP)showMsg('ST '+st.toFixed(2).replace(/^0/,''),st<0.1?'好スタート!':st<0.2?'まずまず':'遅れた…',1.6);}
    if(b.s>=0&&!b.F&&!b.fin){
      if(b.isP){
        if(input.l)b.dT-=7*dt;if(input.r)b.dT+=7*dt;
        if(inTurn)b.dT+=2.4*(b.v/b.top)*dt;
      }else{
        const dtt=distToTurn(b.s);
        if(dtt>0&&dtt<38){if(b.plan===null)b.plan=planFor(b);b.dT=b.plan;}
        else if(inTurn){b.plan=null;b.dT=Math.max(0.8,b.dT-0.6*dt);}
        else{b.plan=null;}
      }
    }
    b.dT=Math.max(0.5,Math.min(17,b.dT));
    const lr=b.isP?7:5.5;const dd=Math.max(-lr*dt,Math.min(lr*dt,b.dT-b.d));b.d+=dd;b.latV=dd/dt;
    if(Math.abs(dd)>0.001)b.v*=1-0.015*Math.abs(dd);
    if(b.s>=L+TURN_LEN*0.5&&b.d1M===null)b.d1M=b.d;
    if(!b.fin&&!b.F&&b.s>=TOTAL){b.fin=true;b.finT=T;b.dT=17;if(b.isP){const pl=order().indexOf(b)+1;showMsg(pl+'着 ゴール',pl===1?'優勝!':'',2.4);}}
  }
  if(!snapshot){const lead=boats.filter(b=>!b.F).sort((a,b)=>b.s-a.s)[0];if(lead&&lead.s>=L+TURN_LEN)snapshot={leader:lead.i};}
  for(const b of boats)b.wake=false;
  const act=boats.filter(b=>!b.F&&!b.fin&&b.s>-80);
  for(let a=0;a<act.length;a++)for(let c=0;c<act.length;c++){if(a===c)continue;const A=act[a],B=act[c];const gap=A.s-B.s;if(gap<=0)continue;const ld=Math.abs(A.d-B.d);
    if(gap<4.4&&ld<2.4){const sgn=B.d>=A.d?1:-1;const push=(2.4-ld)*0.35;B.d+=sgn*push;A.d-=sgn*push*0.35;B.d=Math.max(0.5,Math.min(17,B.d));A.d=Math.max(0.5,Math.min(17,A.d));B.v*=1-1.4*dt;if(B.isP||A.isP)shake=Math.min(1,shake+0.35);}
    else if(gap<15&&ld<2.2&&B.s>0)B.wake=true;}
  if(state==='prestart'&&T>=0){state='race';$('goBtn').style.display='none';$('startUI').style.display='none';}
}

let shake=0;
function updateBoatVisuals(dt,t){
  boats.forEach((b,k)=>{const tp=trackPos(b.s,b.d);const g=b.m.g;
    const yaw=Math.atan2(tp.fx,tp.fz)-Math.max(-0.35,Math.min(0.35,(b.latV||0)*0.045));
    const sp=Math.min(1,b.v/30);
    g.position.set(tp.x,waveH(tp.x,tp.z,t)*0.7+0.02+sp*0.12+Math.sin(t*9+k)*0.03*sp,tp.z);
    g.rotation.y=yaw;
    const inTurn=tp.turn>0&&b.s>=0;
    const bankT=(inTurn?-0.34*sp:0)-(b.latV||0)*0.02;b.bank+=(bankT-b.bank)*Math.min(1,dt*5);
    b.m.body.rotation.z=b.bank;b.m.body.rotation.x=-0.06*sp-(Math.sin(t*7+k*2)*0.015*sp);
    boatU[k].set(tp.x,tp.z,sp,yaw);
    if(sp>0.12){const fx=Math.sin(yaw),fz=Math.cos(yaw),rx=-fz,rz=fx,x=g.position.x,z=g.position.z,v=b.v;
      b.emitAcc[0]+=dt*(60*sp);b.emitAcc[1]+=dt*(inTurn?260*sp:25*sp);b.emitAcc[2]+=dt*28*sp;
      while(b.emitAcc[0]>=1){b.emitAcc[0]--;emit(x-fx*2.2+(Math.random()-0.5)*0.3,0.3,z-fz*2.2,-fx*v*0.22+rx*(Math.random()-0.5)*2.5,3+Math.random()*3.5*sp,-fz*v*0.22+rz*(Math.random()-0.5)*2.5,0.8+Math.random()*0.6,0.6+Math.random()*1.0);}
      while(b.emitAcc[1]>=1){b.emitAcc[1]--;const o=0.8+Math.random()*0.6,m=v*(0.18+Math.random()*0.32);emit(x+rx*o-fx*(Math.random()*1.8),0.25,z+rz*o-fz*(Math.random()*1.8),rx*m-fx*v*0.12,2+Math.random()*4*sp,rz*m-fz*v*0.12,0.6+Math.random()*0.6,0.9+Math.random()*1.6);}
      while(b.emitAcc[2]>=1){b.emitAcc[2]--;const sg=Math.random()<0.5?-1:1;emit(x+fx*1.6+rx*sg*0.8,0.2,z+fz*1.6+rz*sg*0.8,rx*sg*(2+Math.random()*2)+fx*v*0.3,1+Math.random()*1.5,rz*sg*(2+Math.random()*2)+fz*v*0.3,0.4,0.5+Math.random()*0.5);}
    }
  });
}

const camPos=new THREE.Vector3(-120,8,40),camLook=new THREE.Vector3(-100,1,10),tmpP=new THREE.Vector3(),tmpL=new THREE.Vector3();
function updateCamera(dt,t){
  const pb=boats.find(b=>b.isP)||boats[0];if(!pb)return;const g=pb.m.g;const f=new THREE.Vector3(Math.sin(g.rotation.y),0,Math.cos(g.rotation.y));const r=new THREE.Vector3(-f.z,0,f.x);
  const ord=order();const lead=(ord[0]&&ord[0].m.g)||g;
  let fov=55,k=3.2;
  const tp=trackPos(pb.s,pb.d);const inTurn=tp.turn>0&&pb.s>=0;
  if(state==='prestart'){
    tmpP.copy(g.position).addScaledVector(f,-6).addScaledVector(r,13).setY(3.2);tmpL.copy(g.position).addScaledVector(f,10).setY(1.2);fov=50;
    if(T>-2.2){tmpP.copy(g.position).addScaledVector(f,-10).addScaledVector(r,2).setY(3.4);tmpL.copy(g.position).addScaledVector(f,14).setY(1);fov=58;}
  }else if(state==='done'){
    const a=t*0.25;tmpP.set(g.position.x+Math.cos(a)*14,5,g.position.z+Math.sin(a)*14);tmpL.copy(g.position).setY(1.2);fov=45;k=2;
  }else if(camMode===0&&!pb.F){
    if(inTurn){tmpP.copy(g.position).addScaledVector(f,-5).addScaledVector(r,9).setY(2.6);tmpL.copy(g.position).addScaledVector(f,5).addScaledVector(r,-2).setY(0.9);fov=60;k=2.4;}
    else{tmpP.copy(g.position).addScaledVector(f,-10.5).setY(3.8);tmpL.copy(g.position).addScaledVector(f,9).setY(1.2);fov=56+Math.min(1,pb.v/30)*8;}
  }else if(camMode===1||pb.F){
    const lx=lead.position.x;tmpP.set(Math.max(-150,Math.min(150,lx*0.85)),24,78);tmpL.set(lx,0.8,lead.position.z*0.6);fov=26;k=2.2;
  }else{
    tmpP.copy(g.position).addScaledVector(f,-16).setY(46);tmpP.z+=10;tmpL.copy(g.position).addScaledVector(f,10);fov=48;k=2.5;
  }
  const a=1-Math.exp(-dt*k);camPos.lerp(tmpP,a);camLook.lerp(tmpL,1-Math.exp(-dt*(k+2)));
  camera.position.copy(camPos);
  if(shake>0){camera.position.x+=(Math.random()-0.5)*shake*0.5;camera.position.y+=(Math.random()-0.5)*shake*0.4;shake=Math.max(0,shake-dt*2.5);}
  camera.lookAt(camLook);
  if(Math.abs(camera.fov-fov)>0.05){camera.fov+=(fov-camera.fov)*Math.min(1,dt*3);camera.updateProjectionMatrix();setPScale();}
  sky.position.copy(camera.position);
}

const mapCv=$('map'),mctx=mapCv.getContext('2d');
function drawMap(){const w=mapCv.width,h=mapCv.height;mctx.clearRect(0,0,w,h);const sc=w/(L+2*R+44),cx=w/2,cy=h/2;
  mctx.strokeStyle='rgba(255,255,255,.28)';mctx.lineWidth=2;mctx.beginPath();
  for(let s=0;s<=P;s+=4){const p=trackPos(s,6);const x=cx+p.x*sc,y=cy+p.z*sc*1.35;s===0?mctx.moveTo(x,y):mctx.lineTo(x,y);}mctx.stroke();
  mctx.fillStyle='#ff7a1a';[L/2,-L/2].forEach(x=>{mctx.beginPath();mctx.arc(cx+x*sc,cy,3.5,0,7);mctx.fill();});
  boats.forEach(b=>{const p=trackPos(b.s,b.d);mctx.fillStyle=LANE_CSS[b.i];mctx.beginPath();mctx.arc(cx+p.x*sc,cy+p.z*sc*1.35,b.isP?7:5,0,7);mctx.fill();mctx.lineWidth=b.isP?3:1.5;mctx.strokeStyle=b.isP?'#ffd400':'rgba(0,0,0,.6)';mctx.stroke();});}

let hudT=0;
function updateHUD(dt){
  hudT+=dt;if(hudT<0.08)return;hudT=0;
  const ord=order();const pb=boats.find(b=>b.isP);
  ord.forEach((b,idx)=>{const e=$('rk'+b.i);if(e){e.style.order=idx;e.style.opacity=b.F?0.45:1;}});
  $('rank').style.display='flex';
  const pl=ord.indexOf(pb)+1;
  $('pos').innerHTML=pb.F?'F':(state==='prestart'?'-':pl+'<small>着</small>');
  const lap=Math.max(1,Math.min(LAPS,Math.floor(Math.max(0,pb.s)/P)+1));$('lap').textContent=lap+'/'+LAPS;
  $('rtime').textContent=state==='prestart'?'スタート前':(pb.fin?pb.finT:Math.max(0,T)).toFixed(2);
  if(state==='prestart'){$('clockTxt').textContent=(T<0?'':'+')+T.toFixed(1);
    const pred=pb.go?(pb.st!==null?pb.st:T+ttc(-pb.s,pb.v,pb.acc,pb.top)):T+ttc(-pb.s,pb.v,pb.acc,pb.top);
    const pct=Math.max(0,Math.min(100,40+pred/0.15*15));$('stmark').style.left='calc('+pct+'% - 2px)';}
  drawMap();
}

function finishRace(){
  state='done';
  const ord=order();const pb=boats.find(b=>b.isP);const winner=ord[0];
  let kim='恵まれ';
  if(!winner.F){
    const b1=boats[0];
    if(snapshot&&snapshot.leader===winner.i){
      if(winner.i===0)kim='逃げ';
      else if(b1.d1M!==null&&winner.d1M!==null&&winner.d1M<b1.d1M)kim='差し';
      else{const inner=boats.filter(o=>o.i<winner.i&&!o.F&&o.d1M!==null);const maxIn=inner.length?Math.max(...inner.map(o=>o.d1M)):0;kim=(winner.d1M!==null&&winner.d1M<maxIn&&winner.i>=2)?'まくり差し':'まくり';}
    }else kim='抜き';
  }
  $('kimarite').innerHTML=kim+'<small>'+(winner.i+1)+'号艇 '+winner.name+'</small>';
  const tb=$('resTable');tb.innerHTML='';
  ord.forEach((b,idx)=>{const tr=document.createElement('tr');if(b.isP)tr.className='me';
    tr.innerHTML=`<td>${b.F?'F':(idx+1)+'着'}</td><td><span class="chip" style="background:${LANE_CSS[b.i]};color:${LANE_INK[b.i]}">${b.i+1}</span></td><td>${b.name}</td><td style="text-align:right">${b.st===null?'-':(b.st<0?'F':'')+Math.abs(b.st).toFixed(2).replace(/^0/,'')}</td><td style="text-align:right">${b.fin?b.finT.toFixed(1)+'s':'-'}</td>`;tb.appendChild(tr);});
  const pl=pb.F?0:ord.indexOf(pb)+1;const pts=[0,10,8,6,4,2,1][pl]||0;const prize=[0,280,120,80,50,35,25][pl]||0;
  save.races++;save.points+=pts;save.prize+=prize;if(pl===1)save.wins++;persist();
  $('eRank').textContent=pb.F?'F':pl+'着';$('eST').textContent=pb.st===null?'-':(pb.st<0?'F':'')+Math.abs(pb.st).toFixed(2).replace(/^0/,'');$('ePrize').textContent=prize;
  setTimeout(()=>{$('result').classList.remove('hidden');},1800);
}

function refreshMenu(){
  $('sGrade').textContent=grade();$('sRate').textContent=rate().toFixed(2);$('sWins').textContent=save.wins;$('sPrize').textContent=save.prize;
  const ts=tiltStats(tilt);$('tiltV').textContent=(tilt>0?'+':'')+tilt.toFixed(1)+'°';
  $('bAcc').style.width=(ts.acc-0.85)/0.2*100+'%';$('bTop').style.width=(ts.top-0.98)/0.1*100+'%';$('bTurn').style.width=(ts.turn-0.85)/0.2*100+'%';
  [...$('laneSel').children].forEach((e,i)=>e.classList.toggle('sel',i===playerLane));
}
for(let i=0;i<6;i++){const b=document.createElement('button');b.className='lane';b.textContent=i+1;b.style.background=LANE_CSS[i];b.style.color=LANE_INK[i];b.setAttribute('aria-label',(i+1)+'号艇');b.onclick=()=>{playerLane=i;refreshMenu();};$('laneSel').appendChild(b);}
$('tilt').addEventListener('input',e=>{tilt=parseFloat(e.target.value);refreshMenu();});
$('startRace').onclick=()=>{$('menu').classList.add('hidden');setupRace();};
$('again').onclick=()=>{$('result').classList.add('hidden');$('menu').classList.remove('hidden');state='menu';refreshMenu();$('rank').style.display='none';};
$('camBtn').onclick=()=>{camMode=(camMode+1)%3;$('camBtn').textContent='カメラ: '+CAM_NAMES[camMode];};
function doGo(){if(state!=='prestart')return;const pb=boats.find(b=>b.isP);if(pb&&!pb.go){pb.go=true;$('goBtn').style.display='none';}}
$('goBtn').addEventListener('pointerdown',e=>{e.preventDefault();doGo();});
function bindPad(id,key){const el=$(id);const on=e=>{e.preventDefault();input[key]=true;el.classList.add('on');try{el.setPointerCapture(e.pointerId);}catch(_){}};const off=()=>{input[key]=false;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off);el.addEventListener('contextmenu',e=>e.preventDefault());}
bindPad('leftBtn','l');bindPad('rightBtn','r');
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')input.l=true;if(e.key==='ArrowRight'||e.key==='d')input.r=true;if(e.key===' '){doGo();}if(e.key==='c'||e.key==='C')$('camBtn').click();});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')input.l=false;if(e.key==='ArrowRight'||e.key==='d')input.r=false;});

function setPScale(){const h=renderer.domElement.height;pMat.uniforms.uScale.value=h*0.5/Math.tan(camera.fov*Math.PI/360);}
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();setPScale();}
window.addEventListener('resize',resize);resize();

function idleBoats(t){
  meshes.forEach((m,i)=>{const x=-L/2-70+i*3.2,z=R+LANE_D[i];m.g.position.set(x,waveH(x,z,t)*0.8+0.02,z);m.g.rotation.y=Math.PI/2;m.body.rotation.z=Math.sin(t*1.2+i)*0.03;m.body.rotation.x=Math.sin(t*1.5+i)*0.02;boatU[i].set(x,z,0,Math.PI/2);});
  const a=t*0.08;camera.position.set(-L/2-55+Math.cos(a)*24,6+Math.sin(t*0.3),R+8+Math.sin(a)*20);camera.lookAt(-L/2-60,1.2,R+7);sky.position.copy(camera.position);
}

const clk=new THREE.Clock();let wt=0;
function loop(){requestAnimationFrame(loop);let dt=Math.min(clk.getDelta(),0.05);wt+=dt;
  wInner.uniforms.uT.value=wt;wOuter.uniforms.uT.value=wt;sky.material.uniforms.uT.value=wt;
  marks.forEach((m,i)=>{m.position.y=waveH(m.position.x,0,wt)*0.8;m.rotation.z=Math.sin(wt*1.3+i)*0.04;});
  if(state==='menu'){idleBoats(wt);}
  else{
    if(state==='prestart'||state==='race'){step(dt*0.5);step(dt*0.5);if(state==='prestart')drawClock(T);}
    else if(state==='done'){step(dt);}
    updateBoatVisuals(dt,wt);updateCamera(dt,wt);updateHUD(dt);
    if(state==='race'){const pb=boats.find(b=>b.isP);const all=boats.every(b=>b.fin||b.F);if(pb.fin||pb.F){endTimer+=dt;}
      if(all||(pb.fin&&endTimer>9)){finishRace();}}
  }
  if(msgTimer>0){msgTimer-=dt;if(msgTimer<=0)$('msg').classList.remove('show');}
  updParticles(dt);
  renderer.render(scene,camera);
}
$('rank').style.display='none';
refreshMenu();
document.fonts&&document.fonts.ready.then(()=>{drawClock(-9);});
$('loading').remove();
loop();
})();
</script>
